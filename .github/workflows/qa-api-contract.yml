# GENERATED by ofis-qa · api/schemathesis · template_version 0.2.0 · videoai
# API kontrat kapısı — OpenAPI spec'inden otomatik fuzzing.
name: qa-api-contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "schemathesis==4.*"
      - name: kontrat testi
        env:
          QA_OPENAPI: ${{ vars.QA_OPENAPI }}
          QA_API_URL: ${{ vars.QA_API_URL }}
        run: |
          spec="${QA_OPENAPI:-openapi.json}"
          if [ -z "${QA_API_URL:-}" ]; then
            echo "::warning::QA_API_URL tanımlı değil — kontrat testi ölçülemedi"
            exit 0
          fi
          if [ ! -f "$spec" ] && [[ "$spec" != http://* ]] && [[ "$spec" != https://* ]]; then
            echo "::warning::OpenAPI şeması bulunamadı ($spec) — kontrat testi ölçülemedi"
            exit 0
          fi
          schemathesis run "$spec" --url "$QA_API_URL" --checks all
