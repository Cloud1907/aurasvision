# GENERATED by ofis-qa · web/default · template_version 0.2.0 · videoai
# PR gate — Playwright web E2E. Ürünün KENDİ CI'ında koşar (ADR-0012 sınırı).
name: qa-web-e2e
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: web E2E
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
        run: |
          if [ -z "${QA_BASE_URL:-}" ]; then
            python3 -m http.server 8000 --directory web >/tmp/auras-e2e-http.log 2>&1 &
            export QA_BASE_URL="http://127.0.0.1:8000"
            for deneme in $(seq 1 20); do
              curl -fsS "$QA_BASE_URL" >/dev/null && break
              sleep 0.5
            done
            curl -fsS "$QA_BASE_URL" >/dev/null || {
              cat /tmp/auras-e2e-http.log
              exit 1
            }
          fi
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
