# GENERATED by ofis-qa · web/default · template_version 0.2.0 · videoai
# PR gate — Playwright web E2E. Ürünün KENDİ CI'ında koşar (ADR-0012 sınırı).
name: qa-web-e2e
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: web E2E
        run: npx playwright test
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
