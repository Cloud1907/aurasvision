# =====================================================================
# AGENT OFİSİ — CI Required Checks (GENERATED by bin/ofis-sync)
# =====================================================================
# Tek kaynak = projects/videoai.yml — elle düzenleme, sync üzerine yazar.
# İlke (S1): her adım GERÇEK komut koşar. Tanımsız komut = görünür ::warning::
# (sahte yeşil değil, sarı). Maintainer makinesine mutlak path referansı YASAK;
# ofis araçları yalnız repo içinde mevcutsa koşar, yoksa görünür uyarıyla atlanır.
# =====================================================================
name: required-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# stack: python
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks tam geçmiş tarar

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml pytest
      - run: '[ -f requirements.txt ] && pip install -r requirements.txt || true'

      - name: typecheck
        run: |
          echo "::warning::typecheck komutu manifest.commands içinde tanımlı değil"

      - name: lint
        run: |
          echo "::warning::lint komutu manifest.commands içinde tanımlı değil"

      - name: test
        run: |
          # CI'da .venv yok — bağımlılıklar sistem Python'una kurulur.
          # "source .venv/bin/activate" burada her koşuda kırılıyordu
          # (bu workflow HİÇ yeşil olmamıştı).
          pytest -q

      - name: build
        run: |
          find src -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: dep_audit
        continue-on-error: true     # advisory (enforced modda blocking'e çekilebilir)
        run: |
          pip install pip-audit && pip-audit

      - name: secret_scan           # gitleaks binary (action DEĞİL — GitHub API izni gerektirmez)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: clean_code_metrics    # eşik + ratchet; ofis araçları repoda varsa koşar
        run: |
          if [ -f bin/ofis-metrics ]; then
            python bin/ofis-metrics "$GITHUB_WORKSPACE" --check --manifest videoai
          else
            echo "::warning::bin/ofis-metrics bu repoda yok — clean_code gate atlandı (Agent Ofis araç kurulumu gerekli)"
          fi

      - name: waiver_check          # expired waiver yalnız dokunulan gate/path'i bloklar
        run: |
          if [ -f bin/ofis-sync ]; then
            python bin/ofis-sync videoai --waiver-check
          else
            echo "::warning::bin/ofis-sync bu repoda yok — waiver gate atlandı"
          fi
