# VideoAI — POC yapılandırması
# Tüm eşik/parametreler burada; kodda magic number yok (manifest convention).

device: auto            # auto | mps | cuda | cpu  (auto: MPS > CUDA > CPU)

# Kameralar — POC'ta demo videolar kamera gibi tanımlı.
# Üretimde source: rtsp://kullanıcı:şifre@ip:554/stream (şifre .env'den, hardcode yok).
cameras:
  - id: giris
    name: "Giriş Kapısı"
    source: data/videos/people-detection.mp4
    tasks: {count: true, plate: false, face: false}
  - id: otopark
    name: "Otopark (ANPR)"
    source: data/videos/person-bicycle-car-detection.mp4
    tasks: {count: false, plate: true, face: false}
  - id: kasa
    name: "Kasa Önü"
    source: data/videos/store-aisle-detection.mp4
    tasks: {count: true, plate: false, face: true}

server:
  host: 127.0.0.1
  port: 8000
  # Erişim anahtarı AURAS_TOKEN ortam değişkeninden okunur (config'e yazılmaz).

db:
  # PostgreSQL (Timescale+pgvector): DATABASE_URL ortam değişkeni öncelikli.
  # Boşsa SQLite'a düşer (yerel demo). Örn: postgresql://auras:auras@localhost:5433/auras
  url: ""

redis:
  # Olay veri yolu (worker → ingestor). REDIS_URL env öncelikli.
  # Örn: redis://localhost:6379/0 — boşsa worker/ingestor çalışmaz (Test ekranı etkilenmez).
  url: ""

go2rtc:
  # Canlı izleme fan-out'u. url set ise UI canlı görünümde go2rtc player kullanır
  # (docker compose go2rtc servisini başlatır). Boş bırakılırsa snapshot moduna düşer.
  url: http://localhost:1984
  config_path: go2rtc/go2rtc.yaml   # API kameralardan otomatik üretir

worker:
  engine: nvdec       # nvdec: GB10 GPU pipeline (NVDEC+batch TensorRT, ADR-0003)
                      # ultralytics: eski motor (Mac/CPU geliştirme + fallback)
  # Kamera/worker oranı (GB10 ölçümü, docs/olcumler-gb10.md): worker başına ~48
  # kamera tam 5 fps'te taşınır (GPU ~%40); 100 kamera = 2 worker süreci
  # (AURAS_CAMERAS=... ile bölüştür). Tek worker 96 kamerada ~3.6 fps/kam'a düşer.
  loop_interval: 30   # ultralytics motoru, dosya kaynakları: tur arası bekleme sn (0 = tek geçiş)
  batch_max: 32       # nvdec: tek TensorRT inference'ına girecek azami kare
  second_stage_interval: 0.7   # nvdec: plaka/yüz tetikleri arası asgari sn (kamera başına)

motion:               # nvdec: hareket ön-filtresi (Y-düzlemi fark, GPU)
  enabled: true
  min_frac: 0.002     # değişen piksel oranı bunun altındaysa kare analize girmez

paths:
  output_dir: output
  db_path: output/aurasvision.db   # yalnız SQLite fallback için
  video_dir: data/videos

detect:
  model: yolo11s.engine  # TensorRT FP16 dinamik batch (GB10; üret:
                         # yolo export model=yolo11s.pt format=engine half=True dynamic=True batch=32)
                         # GPU'suz geliştirmede (Mac) yolo11n.pt kullan
  fps: 5                 # nvdec motoru: kamera başına analiz temposu (substream hedefi)
  conf: 0.35             # tespit güven eşiği
  iou: 0.5
  imgsz: 640             # KALABALIK/uzak sahnede 1280 yap (ölçüm: crowd_meydan tek karede
                         # n@640=1, n@1280=7, s@1280=10 kişi) — GPU maliyeti ~4x artar
  vid_stride: 3          # her N karede bir işle (retail'de 2-3 yapıp yükü düşür)

count:
  classes: [0]           # COCO sınıf 0 = person
  tracker: botsort.yaml  # BoT-SORT: ByteTrack'ten daha az ID kopması (mükerrer sayım azalır)
  min_track_frames: 6    # bir track bu kadar kare görülmeden geçişi sayılmaz (parça/sahte ID filtresi)
  cooldown_seconds: 2.0  # aynı track'in aynı çizgide iki sayımı arası asgari süre (salınım filtresi)
  # Çizgi geçişi: kareye göre normalize (0-1). Varsayılan: dikey orta çizgi.
  line:
    x1: 0.5
    y1: 0.0
    x2: 0.5
    y2: 1.0

record:
  # Sürekli kayıt (NVR). Ayrı servis: python -m src.recorder
  # Transcode YOK (-c copy) — GPU inference'a ayrılır; kayıt yalnız paketi diske yazar.
  enabled: true
  dir: rec                 # output/ altında
  segment_seconds: 60      # NOMİNAL; gerçek süre anahtar kareye göre değişir, DB'ye ölçülen yazılır
  # KVKK/mevzuat: sektöre göre 30-45 gün istenir (ofis 15-20, kuyumcu/banka/akaryakıt 45).
  # Müşteri politikasına göre ayarla — fazlası da hukuki risk, azı da.
  # Substream'den kaydet (kamerada url_sub tanımlıysa). ÖLÇEK KALDIRACI:
  # 100 kamera × 30 gün → ana akıştan ~114 TB, substream'den ~16 TB.
  # Kalite düşer; tek kamera görünümü ve analiz ana akışı kullanmaya devam eder.
  use_substream: false
  keep_days: 15
  max_size_gb: 0           # 0 = kota yok. Doluluk riski varsa mutlaka ver (gün değil BOYUT güvenilir)

stream:
  # Bazı HLS/CDN kaynakları ve IP kameralar ek HTTP başlığı ister (Referer, User-Agent,
  # bazen Authorization). Boş bırakılırsa hiçbir başlık gönderilmez.
  # Not: kaynağın kullanım şartlarını kontrol edin — başlık zorunluysa erişim izniniz
  # olduğundan emin olun.
  http_headers: "Referer: https://www.canlimobeseizle.com/"

evidence:
  # Olay kanıt görüntüsü — "34ABC123 okundu" iddiasının denetlenebilir karşılığı.
  # KVKK: tür bazında açılır, süresi dolunca OTOMATİK silinir (veri minimizasyonu).
  enabled: true
  plate: true       # plaka kırpması + bağlam karesi (ALPR'ın asli işlevi)
  intrusion: true   # alarm anının karesi (güvenlik amacının kendisi)
  face: false       # biyometrik veri — varsayılan KAPALI, yalnız embedding saklanır
  keep_days: 30     # bu süreden eski kanıt klasörleri silinir (0 = silme)

intrusion:
  # İhlal alanı (Bölgeler ekranında "⚠ İhlal alanı" ile çizilir), sayım hattında
  # değerlendirilir → o kamerada "Sayım" görevi açık olmalı.
  dwell_seconds: 1.0       # alana giren nesne alarm için bu kadar KALMALI
                           # (sınıra değip geçen yanlış alarm üretmesin)
  cooldown_seconds: 30.0   # aynı track aynı alanda tekrar alarm üretene dek geçecek süre

plate:
  # fast-alpr varsayılan modelleri (TR için ileride fine-tune)
  detector: yolo-v9-t-384-license-plate-end2end
  # OCR alternatifleri (fast-plate-ocr 1.x ile gelir, indirme otomatik):
  #   european-plates-mobile-vit-v2-model  (TR plakalar Avrupa formatı)
  #   cct-s-v2-global-model                (yeni nesil, kütüphane benchmark'ında daha isabetli)
  # Karar ölçümle verilir: scripts/plate_eval.py ile saha görüntüsünde A/B yap.
  ocr: global-plates-mobile-vit-v2-model
  min_conf: 0.4
  # Format doğrulama:
  #   tr          İL(01-81)+HARF(1-3)+RAKAM(2-4); pozisyon-bilinçli O↔0/I↔1/B↔8
  #               düzeltmesi yapar, oturmayan okumayı REDDEDER. TR dışı araç GÖRÜNMEZ.
  #   tr+yabanci  önce TR denenir; olmazsa yabancı plaka kapısından geçirilir
  #               (turist, TIR, sınır trafiği). VARSAYILAN.
  #   none        ham metin — yalnız test/serbest saha
  format: tr+yabanci
  # Yabancı plakada yapısal doğrulama YAPILAMAZ (her ülkenin formatı farklı),
  # bu yüzden güven eşiği daha yüksektir. Düşürmek yanlış okuma riskini artırır.
  foreign_min_conf: 0.75
  # Araç takibi (konum-temelli, ARAÇ başına tek olay):
  # İz bu kadar süre tespit almazsa kapanır ve olay yazılır
  track_lost_seconds: 4
  # Kapanan iz AYNI KONUMDA aynı metinle yeniden belirirse devam sayılır
  # (yaya kalabalığı plakayı uzun örtebilir). Kameradan çıkıp geri gelen
  # araç BAŞKA konumdan girer → süreye bakılmaksızın yeni olay.
  track_rebirth_seconds: 30
  # TEK okumalık iz ancak bu güvenin üstündeyse yazılır. Gece sahasında yanlış
  # okumalar tesadüfen TR şekline oturup 0.4'lük eşikten sızıyordu; gerçek
  # geçiş ya çok okuma üretir ya yüksek güvenli tek okuma.
  single_read_min_conf: 0.65
  # OCR'a girecek plaka kutusunun asgari piksel genişliği. Ölçüm (gündüz,
  # abbey-road): 25-56 px'lik plakalardan 0.6-0.8 güvenli HALÜSİNASYON çıkıyor
  # ('2TC508' gibi) — okunabilirlik ~65 px altında yoktur, güven skoru yalan
  # söyler. Araç kırpması dedektörü uzak plakalara eriştirince şart oldu.
  min_plate_width_px: 65
  # Kara/VIP liste alarmı için asgari okuma sayısı (oylama penceresinde).
  # Gerçek geçiş birden çok kare okutur; tek karelik eşleşme alarm olmaz.
  alert_min_reads: 2

bildirim:
  # Alarm webhook'u: doluysa her alarm bu adrese JSON POST edilir (3 sn zaman
  # aşımı, ayrı iş parçacığı — analiz hattı beklemez). Santral/SIEM/n8n köprüsü.
  webhook_url: ""

arama:
  # Görünüm araması (SigLIP, Apache-2.0): izlenen nesne kırpmaları vektörlenir,
  # arşivde serbest metinle aranır. NVIDIA LocateAnything DEĞİL — onun lisansı
  # ticari kullanımı yasaklıyor (src/arama.py başlığı).
  enabled: true
  sample_seconds: 2      # kamera başına örnekleme aralığı
  keep_days: 30          # küçük görüntülerin saklama süresi (vektörler kalır)

face:
  model_pack: buffalo_l  # InsightFace: tespit + ArcFace + yaş/cinsiyet
  det_size: 640
  # Anonim demografi varsayılan; isimli tanıma KVKK kapısına bağlı (forbidden).
  identify: false
  match_threshold: 0.5   # cosine benzerlik eşiği (kalibre et)
  reid_threshold: 0.30   # ArcFace cosine — aynı kişi eşiği: hem canlı re-ID (kapanan
                         # track'in yeni tespitle diriltilmesi) hem finalize öncesi
                         # dedup geçişi bu eşiği kullanır. Eş-zamanlılık vetosu sayesinde
                         # gevşek tutulabilir (aynı karede görünen track'ler asla birleşmez).
                         # Kasa Önü pairwise matrisiyle kalibre (scripts/face_calib.py):
                         # ayrık farklı-kişi max 0.259 → 0.30 eşiği ≥0.03 marj bırakır
  det_min_score: 0.60    # tespit skor tabanı: altındaki tespitler track'lere HİÇ girmez
                         # (raw_detections teşhis için yine sayar). Abide giriş kameraları
                         # kalibrasyonu: doku tespitlerinin p25'i ~0.58, gerçek yüzlerin
                         # p25'i ≥0.71 → 0.60 doku kuyruğunu keser, gerçek yüzü kaçırmaz
  # Doku filtreleri (finalize'da, izleme eşleşmesi olmayan track'lere; ikisi tamamlayıcı):
  min_track_move: 0.05   # DONMUŞ doku: track merkez gezintisi (max eksen aralığı) son yüz
                         # boyutunun bu oranından KÜÇÜKSE doku sayılır — sayılmaz, DB'ye
                         # yazılmaz. Kalibrasyon: portre (sabit durup konuşan) 1.14-1.38,
                         # en kısa gerçek parça (Kasa, 3 kare) 0.02 — bu yüzden taban
                         # bilinçli düşük; esas doku temizliğini adım filtresi yapar
  calm_step: 0.05        # adım eşiği: ardışık iki tespit arası merkez kayması yüz boyutunun
                         # bu oranının altındaysa 'sakin' adımdır (gerçek yüzün nefes/kafa/
                         # yürüyüş adımı sakindir; dokuda tespit taştan taşa sıçrar)
  min_calm_frac: 0.30    # SEKEN doku: sakin adım oranı bunun altındaysa doku sayılır.
                         # Kalibrasyon (scripts/face_calib.py sakin sütunu): gerçek yüz
                         # track'leri 0.48-1.00 (portre 0.85+, yürüyüş ≥0.53, Kasa ≥0.71,
                         # abide'deki tek net yüz 0.70); abide doku track'leri 0.00-0.15
                         # → 0.30 eşiği iki banda da ≥2x marj bırakır
  reid_top_k: 3          # track başına saklanan embedding sayısı (en yüksek det_score'lu
                         # K kare) — benzerlik kümeler arası MAX cosine; tek temsilcinin
                         # poz/ışık kaçırmasını azaltır
  cooccur_frames: 2      # eş-zamanlılık vetosu: iki track bundan fazla AYNI işlenmiş
                         # karede tespit edildiyse iki ayrı insandır — asla birleşmez
  min_track_frames: 3    # bundan az karede görülen VE izleme eşleşmesi olmayan track
                         # hayalet tespittir — sayılmaz, DB'ye yazılmaz
  gallery_max: 128       # kapanmış kimlik (re-ID gallery) üst sınırı — uzun kayıt/RTSP'de
                         # bellek ve tarama maliyeti sınırlı kalsın; aşılınca önce dedup ile
                         # kompaktlanır, yine aşarsa en az görülenler canlı taramadan emekliye
                         # ayrılır (final sayıma yine girerler)
  track_timeout_seconds: 2.0   # nvdec: yüz bu kadar sn görünmezse track kapanır (tek olay yazılır)

fire:
  # YANGIN/DUMAN ERKEN UYARI — sertifikalı yangın alarm sistemi DEĞİLDİR.
  # Video tabanlı tespit EN 54 kapsamında değil; mevcut yangın sistemini
  # TAMAMLAR, yerine geçmez. Gerekçe: src/fire.py başlığı.

  # ── Dedektör motoru — LİSANS KARARI, performans tercihi değil ──
  # rfdetr      Apache-2.0 (RF-DETR N/S/M/L). Ticari kullanımda serbest,
  #             ödeme yok, kaynak açma yükümlülüğü yok. VARSAYILAN.
  #             DİKKAT: RF-DETR XL/2XL PML 1.0'dır ve desteklenmez.
  # ultralytics AGPL-3.0. Kapalı kaynak üründe ya tüm kaynağı açmayı ya
  #             Enterprise lisansı gerektirir; AGPL sunucu arkasında sunmayı
  #             da dağıtım sayar. Yalnız geliştirme/karşılaştırma için.
  engine: rfdetr
  agpl_kabul: false   # true yapmadan AGPL motor YÜKLENMEZ (src/dedektor.py kapısı)

  # Genel amaçlı ağırlık BU İŞİ YAPMAZ (COCO'da duman sınıfı yok).
  # Eğitim/indirme: docs/yangin-modeli.md. Model yoksa hat AÇIK HATA verir,
  # sessizce sıfır olay üretmez.
  model: models/fire.pt
  classes: {0: smoke, 1: fire}   # D-Fire sınıf sırası
  conf: 0.35            # tespit güven eşiği (tek başına alarm ANLAMINA GELMEZ)
                        # Saha ölçümü (docs/olcumler-yangin-saha-2026-09-02.md): 0,35'te
                        # aşırı pozlanmış kapı "duman" sanıldı (1 sahte alarm); 0,45'te
                        # sahte alarm 0, alarm gecikmesi +3-16 sn. Sahaya göre seç.
  imgsz: 640
  # Kare bölme: 2 = kare 2×2 bindirmeli karoya bölünür, her karo ayrı geçer.
  # Dedektör 512'ye küçülttüğü için 2K kadrajda yeni tutuşan alev ~10 piksele
  # iner ve ilk 10-15 sn görülmez. Ölçüm: ilk alev tespiti tutuşmadan 14 sn →
  # 3 sn'ye indi (2×2). Maliyet 4× inference; 1 = kapalı.
  tiles: 2
  vid_stride: 3         # her N karede bir işle

  # ── Zamansal doğrulama — hattın asıl değeri burada ──
  # Ölçüm: FIA/BRE bağımsız testinde video duman dedektörleri tek karede
  # ortalama %58 (benzer renkli arka planda %52) başarı gösterdi; SmokeyNet'in
  # baseline'ları geçme sebebi uzam-ZAMANSAL bilgi. Tek kare asla alarm olamaz.
  window_seconds: 6.0   # doğrulama penceresi
  confirm_frames: 4     # pencere içinde aynı odağı doğrulaması gereken kare sayısı
  iou_link: 0.2         # kareler arası "aynı odak" sayılma eşiği
  alarm_seconds: 3.0    # ön uyarı bu kadar SÜRERSE alarma yükselir
  cooldown_seconds: 120 # süren yangın bu aralıkla hatırlatılır (spam değil, sessizlik de değil)
  clip_seconds: 4.0     # kanıt klibi uzunluğu

  # Bölgeler DB'den gelir (zones tablosu): kind='fire' izleme alanı (tanımlıysa
  # yalnız içi değerlendirilir), kind='firemask' maske (kaynak makinesi, egzoz,
  # güneş vuran pencere). ISO/TS 7240-30 kurulum standardının karşılığı.
