<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AurasVision</title>
<script>try{var t=localStorage.getItem('vai-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  /* Tasarım dili: kontrol odası. Tek vurgu rengi, ölçülü durum renkleri,
     keskin köşeler, düz yüzeyler. Degrade/parlama/havalanma YOK — bunlar
     ürün değil demo estetiğidir. Rakamlar tablo hizalı (tabular-nums). */
  :root{
    --bg:#f2f3f5; --panel:#ffffff; --panel-2:#f7f8f9; --hover:#eceef0;
    --ink:#1a1d21; --ink-2:#4d545c; --ink-3:#878e96;
    --line:#e0e3e7; --line-2:#c9cdd3;
    --accent:#2e6fb0; --accent-2:#2e6fb0; --accent-soft:#e7eff7; --accent-ink:#ffffff;
    --ok:#25784a; --ok-soft:#e7f2ec; --warn:#a06b1a; --warn-soft:#f7efdd; --danger:#bb3535; --danger-soft:#f8e9e9;
    --rail:#17191c; --rail-2:#212428; --rail-ink:#d6d9dd; --rail-ink-2:#7e848b; --rail-active:#2a2e33;
    --shadow:0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 8px 28px rgba(0,0,0,.16);
    --r:5px; --r-lg:7px; --t:.13s ease;
  }
  html[data-theme=dark]{
    --bg:#0e0f11; --panel:#151719; --panel-2:#191b1e; --hover:#1f2226;
    --ink:#e7e9ec; --ink-2:#9aa1a8; --ink-3:#6b7178;
    --line:#24272b; --line-2:#33373c;
    --accent:#4e8cc9; --accent-2:#4e8cc9; --accent-soft:#16273a; --accent-ink:#ffffff;
    --ok:#3f9e63; --ok-soft:#12251a; --warn:#cf9b3d; --warn-soft:#2a2210; --danger:#cf4a4a; --danger-soft:#2c1515;
    --rail:#0b0c0e; --rail-2:#17191c; --rail-ink:#cdd1d5; --rail-ink-2:#61666c; --rail-active:#1e2125;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 10px 32px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;line-height:1.45;}
  .v,.mono,.buyuk,td,#rsaat,.countbox{font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}
  .app{display:flex;min-height:100vh;}
  .rail{width:228px;flex-shrink:0;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;border-right:1px solid #000;}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px;}
  .brand .logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
  .brand b{font-size:13.5px;letter-spacing:.14em;color:#fff;font-weight:700;}
  .brand span{font-size:9.5px;color:var(--rail-ink-2);display:block;letter-spacing:.22em;text-transform:uppercase;margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-ink-2);padding:15px 10px 6px;font-weight:700;}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--rail-ink);cursor:pointer;font-size:13px;transition:background var(--t),color var(--t);position:relative;}
  .nav a:hover{background:var(--rail-2);color:#fff;}
  .nav a.on{background:var(--rail-active);color:#fff;}
  .nav a.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:2px;background:var(--accent);}
  .nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.9;}
  .rail-foot{border-top:1px solid var(--rail-2);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ubar{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--rail-2);border-radius:5px;margin-bottom:10px;font-size:12.5px;}
  .ubar .uad{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* PTZ pedi — tek kamera görünümünde, yalnız destekli kamerada */
  .ptzped{position:absolute;right:14px;bottom:14px;display:grid;gap:5px;z-index:5;
    grid-template-areas:". u zi" "l d r" ". . zo";}
  .ptzped button{width:36px;height:36px;border-radius:4px;border:1px solid rgba(255,255,255,.16);
    background:rgba(13,16,20,.74);color:#dfe5ec;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;}
  .ptzped button:active{background:rgba(78,140,201,.5);border-color:rgba(78,140,201,.8);}
  /* Sistem durumu — sabit "aktif" yazısı yerine gerçek bileşen sağlığı */
  .sysbtn{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--rail-ink-2);font-weight:700;background:transparent;border:0;cursor:pointer;padding:4px 6px;border-radius:8px;transition:background var(--t),color var(--t);}
  .sysbtn:hover{background:var(--rail-2);color:#fff;}
  .sysbtn i{width:7px;height:7px;border-radius:50%;background:#64748b;flex-shrink:0;transition:background var(--t),box-shadow var(--t);}
  .sysbtn.ok i{background:var(--ok);}
  .sysbtn.warn i{background:var(--warn);}
  .sysbtn.err i{background:var(--danger);}
  .syspanel{margin-top:10px;background:var(--rail-2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;}
  .sysrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:var(--rail-ink);}
  .sysrow i{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0;}
  .sysrow.bad i{background:#ef4444;}
  .sysrow .d{margin-left:auto;color:var(--rail-ink-2);font-size:11px;}
  /* Nav rozeti — bekleyen uyarı sayısı, operatör ekranı değiştirmeden görür */
  .nav a .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--rail-2);background:transparent;color:var(--rail-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);}
  .icon-btn:hover{background:var(--rail-2);color:#fff;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
  .topbar h1{font-size:17px;font-weight:650;letter-spacing:.01em;margin:0;}
  .topbar .sub{color:var(--ink-2);font-size:13px;margin:2px 0 0;}
  .content{padding:20px 26px 36px;animation:fade .18s ease;max-width:2200px;width:100%;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);}
  .card.pad{padding:20px;}
  .grid{display:grid;gap:18px;}
  .overview{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-height:76px;}
  .stat .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-weight:700;}
  .stat .v{font-size:22px;line-height:1.1;font-weight:650;margin-top:7px;letter-spacing:0;}
  .stat .s{font-size:12px;color:var(--ink-2);margin-top:5px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 14px;}
  .section-head b{font-size:15px;}
  .taskset{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .taskpill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;background:rgba(8,9,11,.6);color:#9aa1a8;letter-spacing:.05em;text-transform:uppercase;}
  .taskpill.on{background:var(--accent-soft);color:var(--accent);}
  /* Kamera duvarı düzeni — operatör kaç bölme istediğini seçer (klasik VMS davranışı).
     Yoğun ızgara bilinçli: operatör ekranında boşluk değil GÖRÜNTÜ olmalı. */
  .tiles{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;}
  .tiles.auto{grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;}
  .tile{border-radius:10px;}
  /* Karo üstü kontroller: normalde gizli, üzerine gelince belirir — görüntüyü kapatmaz */
  .tileact{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;opacity:0;transition:opacity var(--t);z-index:3;}
  .tile:hover .tileact{opacity:1;}
  .tileact button{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
    background:rgba(5,9,16,.72);backdrop-filter:blur(8px);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background var(--t);}
  .tileact button:hover{background:rgba(5,9,16,.92);}
  /* Tam ekran duvar — operatörün asıl çalışma kipi: kenar çubuğu ve başlık gizlenir */
  body.wall .rail,body.wall .topbar{display:none;}
  body.wall .content{padding:8px;max-width:none;}
  body.wall .overview,body.wall .section-head{display:none;}
  body.wall .tiles{gap:6px;}
  body.wall .tile{border-radius:6px;}
  .wallexit{position:fixed;right:14px;top:14px;z-index:40;}
  .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:#05070c;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t),border-color var(--t);}
  .tile:hover{border-color:var(--ink-3);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease;}
  .tile img.loaded{opacity:1;}
  .tile .skel{position:absolute;inset:0;background:linear-gradient(100deg,var(--panel-2) 30%,var(--hover) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .tile .grad{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(transparent,rgba(0,0,0,.76));pointer-events:none;}
  .tile .nm{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .countbox{position:absolute;left:12px;top:10px;display:flex;gap:8px;background:rgba(8,9,11,.88);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:3px;z-index:2;border:1px solid rgba(255,255,255,.08);}
  .countbox span{white-space:nowrap;}
  .live{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(8,9,11,.88);color:#d6d9dd;font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:3px;letter-spacing:.1em;border:1px solid rgba(255,255,255,.08);z-index:2;}
  .live i{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  /* Rozet gerçek oynatma durumunu gösterir — akış yokken "CANLI" yazmaz */
  .tile[data-state=wait] .live i{background:#fbbf24;}
  .tile[data-state=off] .live i{background:#94a3b8;animation:none;}
  /* go2rtc oynatıcısı: tarayıcı kontrol çubuğu olmadan, karoyu tam kaplar */
  auras-stream{position:absolute;inset:0;display:block;background:#05070c;}
  auras-stream video{width:100%;height:100%;object-fit:cover;display:block;}
  /* akış gelene kadar iskelet oynatıcının ÜSTÜNDE durur (siyah kutu görünmesin);
     karo tonları temadan bağımsız koyu — video duvarında beyaz parlama olmaz */
  .tile .skel{z-index:1;background:linear-gradient(100deg,#0c131f 30%,#18243a 50%,#0c131f 70%);background-size:200% 100%;}
  .tile .grad,.tile .nm{z-index:2;}
  .tile[data-state=live] .skel{display:none;}
  /* çevrimdışı: parıltı YOK (parıltı "yükleniyor" demektir) — durgun koyu zemin + uyarı */
  .tile[data-state=off] .skel{animation:none;background:#0c131f;}
  .nosig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:8px;color:#7d8aa0;font-size:13px;font-weight:700;z-index:2;pointer-events:none;}
  .tile[data-state=off] .nosig{display:flex;}
  .tile.clickable{cursor:zoom-in;}
  /* Tek kamera görünümü — duvarda substream, burada TAM çözünürlük */
  .camview{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(1280px,96vw);overflow:hidden;}
  /* Tam ekran tek kamera: 16:9 karo, başlık + veri şeridiyle birlikte ekrana sığar */
  .camview.full{width:min(96vw,calc((100vh - 170px)*1.7778));}
  .camview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .camview .tile{aspect-ratio:16/9;border-radius:0;border:0;box-shadow:none;}
  .camview .tile:hover{transform:none;}
  /* Canlı veri şeridi — o an görülen plaka/yüz/sayım tek satırda */
  .camstrip{display:flex;align-items:center;gap:14px;padding:10px 18px;border-top:1px solid var(--line);
    font-size:13px;white-space:nowrap;overflow:hidden;min-height:41px;}
  .camstrip .lbl{font-size:10.5px;letter-spacing:.8px;color:var(--ink-3);font-weight:700;}
  .camstrip .ayr{width:1px;height:16px;background:var(--line);flex:none;}
  .camstrip .pl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:1px;
    padding:2px 9px;border:1px solid var(--line);border-radius:4px;font-variant-numeric:tabular-nums;}
  .camstrip .pl.taze{color:var(--ok);border-color:var(--ok);}
  .camstrip b{font-variant-numeric:tabular-nums;}
  .subpill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent);}
  /* --- Kamera envanteri --- */
  .camname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chipbtn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-3);border-radius:4px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all var(--t);}
  .chipbtn:hover{border-color:var(--ink-3);color:var(--ink-2);}
  .chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  /* Envanter listesi — kamera başına tek satır; dar ekranda tablo kendi içinde kayar */
  .camlist-wrap{overflow-x:auto;}
  table.camlist{min-width:860px;}
  table.camlist td{vertical-align:middle;padding:10px 14px;}
  table.camlist td:nth-child(2){min-width:210px;}
  table.camlist tbody tr:last-child td{border-bottom:0;}
  .camprev{position:relative;display:block;width:96px;height:54px;padding:0;background:#0c131f;
    border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;}
  .camprev:hover{border-color:var(--line-2);}
  .camprev img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease;}
  .camprev img.loaded{opacity:1;}
  .camprev .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#46536a;}
  .camlist .camname{font-size:13.5px;}
  .camtur{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--ink-3);margin-top:3px;}
  .camadr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);white-space:nowrap;}
  .rowstat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;}
  .rowstat i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink-3);}
  .rowstat.ok{color:var(--ok);}
  .rowstat.ok i{background:var(--ok);}
  .rowstat.err{color:var(--danger);}
  .rowstat.err i{background:var(--danger);}
  .camlist .gorevler{display:inline-flex;gap:6px;}
  .camlist .eylem{display:inline-flex;gap:5px;justify-content:flex-end;}
  .modal.wide{max-width:760px;}
  /* Adımlı kamera ekleme — bul → doğrula → adlandır */
  .step{border-left:2px solid var(--line);padding:0 0 20px 20px;margin-left:13px;position:relative;}
  .step:last-child{border-left-color:transparent;padding-bottom:4px;}
  .step>.no{position:absolute;left:-14px;top:-2px;width:26px;height:26px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-3);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .step.on{border-left-color:var(--accent);}
  .step.on>.no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .step.ok>.no{background:var(--ok);border-color:var(--ok);color:#fff;}
  .step>.bas{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .step>.aciklama{font-size:12px;color:var(--ink-3);margin-bottom:11px;}
  .modal.wide .modalgovde{max-height:64vh;overflow-y:auto;padding-right:4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}
  .field input{width:100%;margin:0;}
  .field .hint{font-size:12px;color:var(--ink-3);margin-top:5px;}
  .adv{border-top:1px solid var(--line);margin-top:4px;padding-top:14px;}
  .adv summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:12px;}
  .searchbar{position:relative;max-width:320px;flex:1;}
  .searchbar input{width:100%;}
  /* Bekleyen alarm satırı — sıradan olaydan görsel olarak ayrışır */
  /* Bölge editörü araç seçimi — ne yaptığı butonun üstünde yazar */
  .toolbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:all var(--t);}
  .toolbtn:last-child{margin-bottom:0;}
  .toolbtn:hover{background:var(--hover);}
  .toolbtn.on{background:var(--accent-soft);border-color:var(--accent);}
  .toolbtn .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
  .toolbtn b{display:block;font-size:13px;}
  .toolbtn i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:1px;}
  .zrow{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);transition:background var(--t);}
  .zrow:last-child{border-bottom:0;}
  .zrow:hover{background:var(--panel-2);}
  .zrow .clsbtn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-3);border-radius:4px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:all var(--t);}
  .zrow .clsbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  /* Kanıt görüntüsü — olayın denetlenebilir karşılığı, tıklayınca büyür */
  .kanit{width:104px;height:59px;object-fit:cover;border-radius:8px;border:1px solid var(--line-2);flex-shrink:0;cursor:zoom-in;background:#0c131f;transition:transform var(--t),border-color var(--t);}
  .kanit:hover{border-color:var(--accent);}
  .kanitbox{max-width:min(1100px,94vw);max-height:88vh;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:block;}
  /* Kamera bazlı olay özeti — "hangi kamerada ne oluyor" tek bakışta */
  .camsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:20px;}
  .camsum .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;cursor:pointer;transition:all var(--t);box-shadow:var(--shadow);}
  .camsum .k:hover{border-color:var(--ink-3);}
  .camsum .k.on{border-color:var(--accent);background:var(--accent-soft);}
  .camsum .k.uyari{border-color:var(--danger);}
  .camsum .ad{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .camsum .buyuk{font-size:24px;font-weight:750;margin-top:6px;}
  .camsum .kir{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}

  /* Modal — prompt()/alert() yerine markalı diyalog */

  .modal{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:22px;}

  .av{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}

  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .btn.ico{padding:8px;}
  input,select{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:5px;padding:8px 10px;font-size:12.5px;transition:border var(--t);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  input::placeholder{color:var(--ink-3);}
  .chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:5px;}
  .metric{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);}
  .metric .k{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;}
  .metric .v{font-size:28px;font-weight:750;letter-spacing:0;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);}

  tr:last-child td{border-bottom:0;}

  .seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:3px;cursor:pointer;font-size:12.5px;font-weight:600;transition:all var(--t);}
  .seg button.on{background:var(--accent);color:#fff;}
  .empty{padding:40px;text-align:center;color:var(--ink-3);}
  @media (max-width:1100px){.app{display:block}.rail{position:relative;width:auto;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav .lbl{grid-column:1/-1;padding-bottom:2px}.rail-foot{margin-top:14px}.overview{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr}.topbar,.content{padding-left:18px;padding-right:18px;}}

<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="logo" id="logo"></span><div><b>AURASVISION</b><span>Görüntü Analitiği</span></div></div>

    <div class="content" id="content"></div>
  </main>
</div>
<script>
/* ---- ikonlar (inline svg, bağımsız) ---- */
const IC={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  live:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  cams:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  zones:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  test:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  report:'<path d="M4 4h16v16H4z"/><path d="M8 12v5M12 9v8M16 14v3"/>',
  events:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.5 21a1.5 1.5 0 0 0 3 0"/>',
  lists:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
};
const svg=(n,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
document.getElementById('logo').innerHTML=
  '<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">'+
  '<path d="M4 11V6a2 2 0 0 1 2-2h5M21 4h5a2 2 0 0 1 2 2v5M28 21v5a2 2 0 0 1-2 2h-5M11 28H6a2 2 0 0 1-2-2v-5"/>'+
  '<rect x="12" y="12" width="8" height="8" fill="currentColor" stroke="none"/></svg>';

/* Sekmeler görev gruplarına ayrıldı: operatör günlük işini (izleme) yönetim
   işinden (kamera/bölge/liste ayarı) ayrı görür. Giriş ekranı artık PANEL —
   önce "sistemde ne oluyor" özeti, sonra detay. */
const NAV=[
  ["panel","Panel","live","İZLEME"],["live","Canlı","cams"],["rec","Kayıtlar","play"],["arama","Arama","search"],
  ["events","Olaylar","events","OLAYLAR"],["rapor","Raporlar","report"],["lists","Tanıma listeleri","lists"],
  ["cams","Kameralar","cams","YÖNETİM"],["zones","Bölgeler","zones"],
  ["test","Test","test"],["sys","Sistem","bolt"]];
const TITLES={panel:["Panel","Sistem özeti"],
  sys:["Sistem","Bileşen durumu ve arşiv"],
  live:["Canlı görünüm","Kamera duvarı"],cams:["Kameralar","Kaynak ve görev yönetimi"],zones:["Bölgeler","Sayım çizgisi ve ihlal alanı"],test:["Test","Tek seferlik analiz"],rec:["Kayıtlar","Arşiv ve geri oynatma"],arama:["Arama","Arşivde serbest metinle nesne bul"],rapor:["Raporlar","Kamera bazlı günlük faaliyet"],events:["Olaylar","Sayım, plaka ve yüz"],lists:["Tanıma listeleri","Plaka ve yüz tanıma · kara liste, VIP, izinli"]};
let CAMS=[],active="panel";
let LIVE_COUNTS={},LIVE_ACTIVE=false;
const $=s=>document.querySelector(s);
/* XSS koruması: kullanıcı/OCR kaynaklı her değer innerHTML'e esc() ile girer */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Erişim anahtarı (AURAS_TOKEN): 401 gelirse bir kez sorulur, localStorage'da tutulur.
   ?token=... ile de verilebilir (tek tık giriş) — kaydedilir ve adres çubuğundan silinir. */
let TOKEN=localStorage.getItem('vai-token')||'';
try{
  const _u=new URL(location.href),_qt=_u.searchParams.get('token');
  if(_qt){
    TOKEN=_qt.trim();localStorage.setItem('vai-token',TOKEN);
    _u.searchParams.delete('token');
    history.replaceState(null,'',_u.pathname+(_u.searchParams.toString()?'?'+_u.searchParams.toString():'')+_u.hash);
  }
}catch(e){}
const tokq=()=>TOKEN?'&token='+encodeURIComponent(TOKEN):'';
/* Bildirim — alert() yerine sağ altta kaybolan şerit (akışı kesmez) */
function toast(msg,kind="",ms=5000){
  let box=$(".toasts");
  if(!box){box=document.createElement("div");box.className="toasts";document.body.appendChild(box);}
  const t=document.createElement("div");t.className="toast "+kind;t.textContent=msg;
  box.appendChild(t);setTimeout(()=>t.remove(),ms);
}
/* Erişim anahtarı diyaloğu — prompt() yerine markalı modal.
   Eşzamanlı 401'ler (boot'ta iki paralel istek) TEK diyalog paylaşır. */
let TOKEN_ASK=null;
function askToken(){
  if(TOKEN_ASK)return TOKEN_ASK;
  const p=new Promise(resolve=>{
    const mask=document.createElement("div");mask.className="mask";
    mask.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="mi">${svg('live',20)}</div>
      <h3 id="mt">Erişim anahtarı</h3>
      <p>Devam etmek için erişim anahtarınızı girin.</p>
      <input id="tokin" type="password" placeholder="AURAS_TOKEN" autocomplete="current-password"/>
      <div class="acts"><button class="btn" id="tokc">Vazgeç</button><button class="btn pri" id="toko">Giriş yap</button></div></div>`;
    document.body.appendChild(mask);
    const inp=mask.querySelector("#tokin");inp.focus();
    const done=v=>{mask.remove();document.removeEventListener("keydown",onkey);resolve(v);};
    const onkey=e=>{if(e.key==="Escape")done("");else if(e.key==="Enter"&&document.activeElement===inp)done(inp.value.trim());};
    document.addEventListener("keydown",onkey);
    mask.querySelector("#toko").onclick=()=>done(inp.value.trim());
    mask.querySelector("#tokc").onclick=()=>done("");
    mask.onclick=e=>{if(e.target===mask)done("");};
  });
  TOKEN_ASK=p.finally(()=>{TOKEN_ASK=null;});
  return TOKEN_ASK;
}
/* Oturum (RBAC): sunucu 401 gövdesinde giriş kipini söyler —
   giris:"parola" → kullanıcı/parola formu (çerezle oturum), giris:"token" → eski anahtar diyaloğu */
let BEN=null,GIRIS_ASK=null;
const rolAd=r=>({yonetici:"Yönetici",operator:"Operatör",izleyici:"İzleyici"}[r]||r||"");
function askGiris(){
  if(GIRIS_ASK)return GIRIS_ASK;
  const p=new Promise(resolve=>{
    const mask=document.createElement("div");mask.className="mask";
    mask.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="mi">${svg('live',20)}</div>
      <h3 id="mt">Oturum aç</h3>
      <p>Devam etmek için kullanıcı adı ve parolanızı girin.</p>
      <input id="gad" placeholder="Kullanıcı adı" autocomplete="username"/>
      <input id="gpw" type="password" placeholder="Parola" autocomplete="current-password" style="margin-top:8px;"/>
      <div class="mut-s" id="ghata" style="color:var(--danger);min-height:17px;margin-top:6px;"></div>
      <div class="acts"><button class="btn" id="gc">Vazgeç</button><button class="btn pri" id="go">Giriş yap</button></div></div>`;
    document.body.appendChild(mask);
    const ad=mask.querySelector("#gad"),pw=mask.querySelector("#gpw");ad.focus();
    const done=v=>{mask.remove();document.removeEventListener("keydown",onkey);resolve(v);};
    async function dene(){
      const r=await fetch("/api/giris",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ad:ad.value.trim(),parola:pw.value})}).catch(()=>null);
      if(r&&r.ok){const b=await r.json();BEN={ad:b.ad,rol:b.rol};benRozet();done(true);return;}
      const b=r?await r.json().catch(()=>({})):{};
      mask.querySelector("#ghata").textContent=b.detail||"Giriş başarısız";pw.select();
    }
    const onkey=e=>{if(e.key==="Escape")done(false);else if(e.key==="Enter")dene();};
    document.addEventListener("keydown",onkey);
    mask.querySelector("#go").onclick=dene;
    mask.querySelector("#gc").onclick=()=>done(false);
    mask.onclick=e=>{if(e.target===mask)done(false);};
  });
  GIRIS_ASK=p.finally(()=>{GIRIS_ASK=null;});
  return GIRIS_ASK;
}
function benRozet(){
  const u=$("#ubar");if(!u)return;
  if(BEN&&BEN.ad){u.hidden=false;
    $("#uad").innerHTML=`<b>${esc(BEN.ad)}</b> <span style="opacity:.6;">· ${esc(rolAd(BEN.rol))}</span>`;
    $("#ubtn").innerHTML=svg('out',15);}
  else u.hidden=true;
}
async function cikis(){try{await fetch("/api/cikis",{method:"POST"});}catch(e){}location.reload();}
async function api(p,o={}){
  o.headers=Object.assign({},o.headers||{},TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  const r=await fetch("/api"+p,o);
  if(r.status===401){
    const b=await r.json().catch(()=>({}));
    if(b.giris==="parola"){
      if(await askGiris())return api(p,o);
      throw new Error("yetkisiz");
    }
    const t=await askToken();
    if(t){TOKEN=t;localStorage.setItem('vai-token',TOKEN);return api(p,o);}
    throw new Error("yetkisiz");
  }
  if(r.status===403){
    const b=await r.json().catch(()=>({}));
    toast(b.detail||"Bu işlem için yetkiniz yok","err");
    throw new Error("yetki yok");
  }
  return r.json();
}
const snap=id=>"/api/snapshot?camera="+encodeURIComponent(id)+tokq();

function toggleTheme(){const d=document.documentElement;const nx=(d.getAttribute('data-theme')==='dark')?'light':'dark';d.setAttribute('data-theme',nx);try{localStorage.setItem('vai-theme',nx);}catch(e){}themeBtn();}
function themeBtn(){const dark=document.documentElement.getAttribute('data-theme')==='dark';$("#theme").innerHTML=svg(dark?'sun':'moon',17);}

let SYS={go2rtc:""};
async function boot(){themeBtn();
  let ben={};[CAMS,SYS,ben]=await Promise.all([api("/cameras"),api("/sysinfo").catch(()=>({go2rtc:""})),api("/ben").catch(()=>({}))]);
  if(ben.ad)BEN={ad:ben.ad,rol:ben.rol};window._kulTanimli=!!ben.kullanici_tanimli;benRozet();
  render();startLiveCounts();startSysWatch();}

/* --- Sistem durumu (kenar çubuğu) ---
   Eskiden sabit "sistem aktif" yazıyordu: DB düşse, worker ölse bile yeşil.
   Artık /api/status'tan gerçek bileşen sağlığı okunur. */
let SYSDURUM=null;
function toggleSys(){const p=$("#syspanel");p.hidden=!p.hidden;if(!p.hidden)cizSys();}
function cizSys(){
  const p=$("#syspanel");if(p.hidden||!SYSDURUM)return;
  p.innerHTML=(SYSDURUM.bilesenler||[]).map(b=>`<div class="sysrow ${b.ok?'':'bad'}"><i></i>${esc(b.ad)}
    <span class="d">${esc(b.detay||(b.ok?'ok':'hata'))}</span></div>`).join("");
}
async function sysYenile(){
  try{
    SYSDURUM=await api("/status");
    const kotu=(SYSDURUM.bilesenler||[]).filter(b=>!b.ok);
    // Worker'sız kurulum "kırmızı" değil sarıdır: test ekranı çalışır, sürekli analiz yoktur
    const kritik=kotu.filter(b=>b.ad!=="Analiz worker").length;
    const btn=$("#sysbtn"),txt=$("#systxt");
    btn.className="sysbtn "+(kritik?"err":kotu.length?"warn":"ok");
    txt.textContent=kritik?`${kritik} bileşen hatalı`:kotu.length?"worker çalışmıyor":"sistem sağlıklı";
    cizSys();
  }catch(e){
    const btn=$("#sysbtn");if(btn){btn.className="sysbtn err";$("#systxt").textContent="sunucuya ulaşılamıyor";}
  }
}
function startSysWatch(){
  clearInterval(window._sysTimer);
  const tur=()=>{sysYenile();alarmYenile();};
  tur();window._sysTimer=setInterval(tur,10000);
}
/* Sayaç kutuları yalnız bir analiz KOŞARKEN görünür — ekran ilk açılışta eski toplamlarla dolmaz */
function countBox(id){const c=LIVE_COUNTS[id];if(!LIVE_ACTIVE||!c)return `<div class="countbox" data-countbox="${esc(id)}" style="display:none;"></div>`;return `<div class="countbox" data-countbox="${esc(id)}"><span>${c.in} giriş</span><span>${c.out} çıkış</span></div>`;}
async function refreshLiveCounts(){try{const res=await api("/counts");LIVE_ACTIVE=!!res.active;const rows=res.rows||[];const next={};rows.forEach(r=>{next[r.camera_id]={in:Number(r.in_count||0),out:Number(r.out_count||0)};});LIVE_COUNTS=next;document.querySelectorAll("[data-countbox]").forEach(el=>{const y=countBox(el.dataset.countbox);if(el.outerHTML!==y)el.outerHTML=y;});
// Panel kartları yalnız İÇERİK DEĞİŞİNCE yenilenir. Koşulsuz outerHTML her
// 2 sn'de DOM'u söküp kuruyordu — ekran yanıp sönüyordu (sahada görüldü).
if(active==="panel"){const ov=document.querySelector("#pn-gorev");const y=overviewStats();
  if(ov&&ov.outerHTML!==y)ov.outerHTML=y;}}catch(e){}}
function startLiveCounts(){clearInterval(window._countTimer);refreshLiveCounts();window._countTimer=setInterval(refreshLiveCounts,2000);}
function taskPills(c){const t=c.tasks||{};return `<span class="taskset"><span class="taskpill ${t.count?'on':''}">Sayım</span><span class="taskpill ${t.plate?'on':''}">Plaka</span><span class="taskpill ${t.face?'on':''}">Yüz</span></span>`;}
/* Canlı ekran özeti — eskiden "Toplam giriş: —" gibi anlamsız kutular vardı:
   hangi kamera, hangi görev, veri neden yok belli değildi. Artık her sayı
   HANGİ kameralara ait olduğunu söyler ve boşsa nedenini yazar. */
function overviewStats(){
  const gorev=k=>CAMS.filter(c=>(c.tasks||{})[k]);
  const say=gorev("count"),pl=gorev("plate"),yz=gorev("face");
  const canli=Object.keys(LIVE_COUNTS).length;
  const giris=LIVE_ACTIVE?Object.values(LIVE_COUNTS).reduce((n,c)=>n+(c.in||0),0):null;
  const cikis=LIVE_ACTIVE?Object.values(LIVE_COUNTS).reduce((n,c)=>n+(c.out||0),0):null;
  const adlar=l=>l.length?l.map(c=>esc(c.name)).join(", "):"tanımlı değil";
  const kutu=(k,v,s,renk)=>`<div class="stat"><div class="k">${k}</div>
    <div class="v"${renk?` style="color:${renk};"`:""}>${v}</div><div class="s">${s}</div></div>`;

/* ---- canlı karo oynatıcısı ----
   go2rtc'nin kendi web bileşeni; iframe DEĞİL — iframe'deki stream.html tarayıcının
   play/ses/tam-ekran çubuğunu karonun içine basıyordu. Bileşen CORS göndermediği
   için kendi origin'imizden vekillenir (/vendor). Rozet gerçek oynatma olaylarından
   beslenir: akış gelmiyorsa karo "CANLI" yazmaz. */
let PLAYER=null;
function loadPlayer(){
  if(!PLAYER)PLAYER=import("/vendor/video-rtc.js").then(m=>{
    if(customElements.get("auras-stream"))return;
    class AurasStream extends m.VideoRTC{
      constructor(){
        super();
        // mode/visibilityThreshold oninit'ten ÖNCE okunur → constructor'da verilir
        this.mode="mse";                // iframe'deki davranışla aynı (WebRTC/ICE sürprizi yok)
        this.visibilityThreshold=0.05;  // görünmeyen karo akış tüketmez (100 kameralı duvar)
      }
      oninit(){
        super.oninit();
        const v=this.video;
        v.controls=false;v.muted=true;v.disablePictureInPicture=true;
        // go2rtc oynatıcısı gecikmeyi kapatmak için playbackRate'i DOĞRUDAN tampon
        // farkına eşitler (video-rtc.js: `playbackRate = gap`): 5 sn tampon → 5x hızlı,
        // tampon boşalınca 0.1x ağır çekim. Gözle görülen "önce fırlıyor sonra sürünüyor"
        // salınımı budur. Yerine hedef ~1 sn gecikmeye yumuşak yakınsama.
        // currentTime ile canlı uca ATLAMA YOK: bu setter SourceBuffer güncelleme
        // döngüsünün içinde çağrılıyor, orada seek yapmak MSE tamponunu boşaltıp
        // akışı kalıcı olarak dondurdu (ölçüldü). Büyük fark en çok 1.25x ile kapatılır.
        const HEDEF=1.0,d=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,"playbackRate");
        Object.defineProperty(v,"playbackRate",{configurable:true,
          get(){return d.get.call(this);},
          set(gap){d.set.call(this,Math.max(0.9,Math.min(1.25,1+(gap-HEDEF)*0.15)));}});
      }
    }
    customElements.define("auras-stream",AurasStream);
  }).catch(e=>{PLAYER=null;console.warn("oynatıcı yüklenemedi",e);toast("Canlı oynatıcı yüklenemedi. go2rtc çalışıyor mu?","err");});
  return PLAYER;
}

/* Canlı veri şeridi — tek kamera görünümünün altındaki tek satır.
   Yalnız AÇIK görevlerin verisi gösterilir (kapalı görev için "okuma yok"
   yazmak gürültü olurdu). 15 sn'den taze plaka yeşil yanar: "o an görülen". */
async function stripGuncelle(id,el){
  if(!el||!document.body.contains(el))return;
  try{
    const ev=await api("/events?limit=40&kamera="+encodeURIComponent(id));
    const t=(CAMS.find(c=>c.id===id)||{}).tasks||{};
    const yas=z=>{const s=String(z).replace(" ","T");return (Date.now()-Date.parse(s.includes("+")||s.endsWith("Z")?s:s+"Z"))/1000;};
    const once=d=>!isFinite(d)?"":d<6?"şimdi":d<60?`${Math.round(d)} sn önce`:d<3600?`${Math.round(d/60)} dk önce`:`${Math.round(d/3600)} sa önce`;
    const par=[];
    if(t.plate){
      const p=ev.find(e=>e.type==="plate");
      if(p){const d=yas(p.time);
        par.push(`<span class="lbl">PLAKA</span><span class="pl ${d<15?'taze':''}">${esc(String(p.detail||"").split(" ")[0])}</span>`+
          `<span class="mut-s">${p.plaka_tur==="yabanci"?"yabancı · ":""}${once(d)}</span>`);}
      else par.push(`<span class="lbl">PLAKA</span><span class="mut-s">henüz okuma yok</span>`);
    }
    if(t.face){
      const f=ev.find(e=>e.type==="face");
      if(f)par.push(`<span class="lbl">YÜZ</span><b>${esc(f.detail||"")}</b><span class="mut-s">${once(yas(f.time))}</span>`);
      else par.push(`<span class="lbl">YÜZ</span><span class="mut-s">henüz tespit yok</span>`);
    }
    if(t.count){
      const c=LIVE_COUNTS[id],g=ev.find(e=>e.type==="count");
      const say=c?`<b>${c.in}</b><span class="mut-s">giriş</span> <b>${c.out}</b><span class="mut-s">çıkış</span>`:`<span class="mut-s">—</span>`;
      par.push(`<span class="lbl">SAYIM</span>${say}${g?`<span class="mut-s">· son geçiş ${once(yas(g.time))}</span>`:""}`);
    }
    el.innerHTML=par.length?par.join(`<span class="ayr"></span>`)
      :`<span class="mut-s">Bu kamerada analiz görevi kapalı — Kameralar ekranından Sayım/Plaka/Yüz açabilirsiniz.</span>`;
  }catch(e){}
}
/* --- PTZ pedi ---
   Yalnız PTZ destekli kamerada görünür (yetenek sorgusu önbelleklidir, PTZ'siz
   kameralar için tek sefer sorulur). Bas-tut → sürekli hareket, bırak → dur. */
window._ptzCaps={};
async function ptzPed(mask,id){
  try{
    if(!(id in window._ptzCaps))window._ptzCaps[id]=await api("/ptz/"+encodeURIComponent(id));
    if(!window._ptzCaps[id].destek)return;
  }catch(e){window._ptzCaps[id]={destek:false};return;}
  const tile=mask.querySelector(".tile");if(!tile)return;
  const ped=document.createElement("div");ped.className="ptzped";ped.onclick=e=>e.stopPropagation();
  const tus=(k,l,pan,tilt,zoom)=>`<button data-p="${pan}" data-t="${tilt}" data-z="${zoom}" style="grid-area:${k};" title="${l}">${l}</button>`;
  ped.innerHTML=`
    ${tus("u","▲",0,0.5,0)}${tus("l","◀",-0.5,0,0)}${tus("r","▶",0.5,0,0)}${tus("d","▼",0,-0.5,0)}
    ${tus("zi","+",0,0,0.5)}${tus("zo","−",0,0,-0.5)}`;
  tile.appendChild(ped);
  let aktif=false;
  const gonder=b=>fetch("/api/ptz/"+encodeURIComponent(id),{method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),
    body:JSON.stringify(b)}).catch(()=>{});
  ped.querySelectorAll("button").forEach(b=>{
    const bas=e=>{e.preventDefault();aktif=true;
      gonder({pan:+b.dataset.p,tilt:+b.dataset.t,zoom:+b.dataset.z});};
    const birak=()=>{if(!aktif)return;aktif=false;gonder({dur:true});};
    b.onpointerdown=bas;b.onpointerup=birak;b.onpointerleave=birak;b.onpointercancel=birak;
  });
}
/* Karo durumu OLAYDAN değil gerçek ilerlemeden okunur: soket açık kaldığı hâlde
   görüntü donabilir (kamera/kodlayıcı takılması) — olay tabanlı tespit bunu kaçırır,
   "video ilerliyor mu" kontrolü yakalar. Ekran dışı karolar atlanır: akışları
   kasten durdurulmuştur (visibilityThreshold), "çevrimdışı" demek yanlış olur. */
function watchTiles(){
  clearInterval(window._tileTimer);
  const tick=()=>document.querySelectorAll("auras-stream").forEach(el=>{
    const tile=el.closest(".tile"),v=el.video;
    if(!tile||!v)return;
    const r=tile.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight)return;         // ekran dışı — değerlendirme yok
    const ct=v.currentTime,moved=ct>(el._ct||0)+0.05;
    el._ct=ct;
    el._stall=moved?0:(el._stall||0)+1;
    if(moved)el._seen=true;
    // Histerezis — rozet titremesin: bağlantı GERÇEKTEN koptuysa (soket kapalı) hızlı
    // "çevrimdışı"; soket açıkken görüntü takılması ağ/çözme dalgalanması olabilir,
    // uzun sabır. İlk kare hiç gelmediyse (yüksek çözünürlüklü kaynak 10+ sn açılabilir)
    // daha da uzun beklenir.
    const kopuk=el.wsState===WebSocket.CLOSED;
    const off=kopuk?2:(el._seen?8:10);
    const s=moved?"live":(el._stall>=off?"off":el._stall>=3?"wait":tile.dataset.state);
    if(s===tile.dataset.state)return;
    tile.dataset.state=s;
    const b=tile.querySelector(".live b");
    if(b)b.textContent=s==="live"?"CANLI":s==="wait"?"BAĞLANIYOR":"ÇEVRİMDIŞI";
  });
  window._tileTimer=setInterval(tick,2000);tick();
}

      if(!h)return {k:"",t:"worker yok"};
      const taze=(Date.now()-new Date(h.time.replace(' ','T')+(h.time.includes('+')?'':'Z')))<15000;
      if(!taze)return {k:"",t:"boşta"};
      if(h.status==='error')return {k:"err",t:"hata"};
      return {k:"ok",t:h.fps?`çalışıyor · ${(+h.fps).toFixed(1)} fps`:"çalışıyor"};};

/* ---- bölge editörü ---- */
let TOOL="line", ZONES=[], DRAFT=[], IMG=null, CV=null, CX=null, DRAG=null, DRAWING=null;
let DIRTY=false, VURGU=-1;   // kaydedilmemiş değişiklik · listede üstüne gelinen bölge
const COL={line:"#f59e0b",zone:"#8b5cf6",intrusion:"#ef4444"};
const TOOL_IPUCU={line:"görüntüde basılı tutup çekin — A ve B uçları oluşur",
  zone:"köşe noktalarına tıklayın, sonra “Bölgeyi bitir”",
  intrusion:"köşe noktalarına tıklayın, sonra “Bölgeyi bitir” — içeride kalan alarm üretir"};
/* Kaydedilmemiş değişiklik göstergesi: çizim yapıp kaydetmeden ekran değiştirince
   emek sessizce kayboluyordu; artık hem görünür hem çıkışta uyarı var. */
function kirlet(){
  DIRTY=true;
  const s=$("#zstatus");if(s){s.textContent="● Kaydedilmemiş değişiklik";s.style.color="var(--warn)";}
  const b=$("#z-save");if(b)b.textContent="Kaydet ●";
}
function temizle(){
  DIRTY=false;
  const s=$("#zstatus");if(s){s.textContent="Tüm değişiklikler kaydedildi";s.style.color="var(--ok)";}
  const b=$("#z-save");if(b)b.textContent="Kaydet";
}
async function zoneCikisOnayi(){
  if(!DIRTY)return true;
  const ok=await confirmDialog("Kaydedilmemiş değişiklik",
    "Bu kameradaki çizim değişiklikleri kaydedilmedi. Çıkarsanız kaybolur.","Kaydetmeden çık");
  if(ok)DIRTY=false;
  return ok;
}
async function zoneCamDegis(v){
  if(!await zoneCikisOnayi()){$("#zcam").value=window._zc;return;}
  window._zc=v;SCREENS.zones();
}
function undoZone(){
  if(DRAFT.length){DRAFT.pop();draw();return;}      // önce yarım çizimi geri al
  if(!ZONES.length)return;
  ZONES.pop();kirlet();draw();renderZoneList();
}
function setTool(t){
  TOOL=t;
  ["line","zone","intrusion"].forEach(x=>document.getElementById("t-"+x)?.classList.toggle("on",x===t));
  const h=$("#zhint");if(h)h.textContent=TOOL_IPUCU[t]||"";
  DRAFT=[];DRAWING=null;draw();
}
function curClasses(){const c=[];if($("#c-person")?.checked)c.push("person");if($("#c-car")?.checked)c.push("car");return c;}
function defName(kind){const n=ZONES.filter(z=>z.kind===kind).length+1;return (kind==="line"?"Çizgi ":kind==="zone"?"Bölge ":"İhlal ")+n;}
async function initEditor(camId){
  CV=$("#cv");CX=CV.getContext("2d");DRAFT=[];DRAWING=null;DRAG=null;
  const z=await api("/zones?camera="+encodeURIComponent(camId));
  // API points/classes'ı parse edilmiş dizi döndürür (eski string formatı da tolere edilir)
  const arr=v=>typeof v==='string'?JSON.parse(v||"[]"):(v||[]);
  ZONES=z.map(x=>({kind:x.kind,name:x.name||defName(x.kind),points:arr(x.points),classes:arr(x.classes),direction:x.direction||'AtoB'}));
  VURGU=-1;temizle();setTool(TOOL);   // yeni kamera → temiz sayfa, ipucu tazelenir
  IMG=new Image();
  IMG.onload=()=>{draw();renderZoneList();};
  IMG.onerror=()=>{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);CX.fillStyle="#64748b";CX.fillText("snapshot alınamadı",240,180);};
  IMG.src=snap(camId)+"&t="+Date.now();
  CV.onmousedown=onDown;CV.onmousemove=onMove;window.onmouseup=onUp;
  renderZoneList();
}
function evNorm(e){const r=CV.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];}
function px(p){return [p[0]*CV.width,p[1]*CV.height];}
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hitHandle(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){const z=ZONES[zi];for(let pi=0;pi<z.points.length;pi++){const[hx,hy]=px(z.points[pi]);if(dist(x*CV.width,y*CV.height,hx,hy)<11)return{zi,pi};}}return null;}
function xBadge(z){const p=px(z.points[z.points.length-1]);return[p[0]+15,p[1]-15];}
function hitX(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){if(!ZONES[zi].points.length)continue;const[bx,by]=xBadge(ZONES[zi]);if(dist(x*CV.width,y*CV.height,bx,by)<11)return zi;}return null;}
/* Poligon kenarına tıklayınca ARAYA nokta ekler — eskiden şekli düzeltmek için
   bölgeyi silip yeniden çizmek gerekiyordu. Alt+tık ile nokta silinir. */
function hitEdge(x,y,tol=9){
  const px_=x*CV.width,py_=y*CV.height;
  for(let zi=ZONES.length-1;zi>=0;zi--){
    const z=ZONES[zi];if(z.kind==="line"||z.points.length<3)continue;
    const p=z.points.map(px);
    for(let i=0;i<p.length;i++){
      const a=p[i],b=p[(i+1)%p.length];
      const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
      let t=((px_-a[0])*dx+(py_-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
      if(Math.hypot(px_-(a[0]+t*dx),py_-(a[1]+t*dy))<tol)return {zi,pi:i+1};
    }
  }
  return null;
}
function onDown(e){
  const[x,y]=evNorm(e);
  const xi=hitX(x,y);if(xi!=null){ZONES.splice(xi,1);kirlet();draw();renderZoneList();return;}
  const h0=hitHandle(x,y);
  if(h0&&(e.altKey||e.metaKey)){          // Alt+tık: noktayı sil (en az 3 kalmalı)
    const z=ZONES[h0.zi];
    if(z.kind!=="line"&&z.points.length>3){z.points.splice(h0.pi,1);kirlet();draw();renderZoneList();}
    else toast("Alan en az 3 nokta ister","warn");
    return;
  }
  if(!h0&&!DRAWING&&!DRAFT.length){       // kenara tık: araya nokta ekle
    const ed=hitEdge(x,y);
    if(ed){ZONES[ed.zi].points.splice(ed.pi,0,[x,y]);DRAG={zi:ed.zi,pi:ed.pi};kirlet();draw();return;}
  }
  const h=hitHandle(x,y);if(h){DRAG=h;return;}
  if(TOOL==="line"){DRAWING={a:[x,y],b:[x,y]};}
  else{DRAFT.push([x,y]);draw();}
}
function onMove(e){
  if(!DRAG&&!DRAWING)return;
  const[x,y]=evNorm(e);
  if(DRAG){ZONES[DRAG.zi].points[DRAG.pi]=[x,y];draw();}
  else if(DRAWING){DRAWING.b=[x,y];draw();}
}
function onUp(){
  if(DRAWING){const d=dist(DRAWING.a[0],DRAWING.a[1],DRAWING.b[0],DRAWING.b[1]);
    if(d>0.03){ZONES.push({kind:"line",name:defName("line"),points:[DRAWING.a,DRAWING.b],classes:curClasses(),direction:"AtoB"});kirlet();renderZoneList();}
    DRAWING=null;draw();}
  if(DRAG){DRAG=null;kirlet();renderZoneList();}
}
function finishPoly(){
  if((TOOL==="zone"||TOOL==="intrusion")&&DRAFT.length>=3){
    ZONES.push({kind:TOOL,name:defName(TOOL),points:DRAFT.slice(),classes:curClasses(),direction:""});
    DRAFT=[];kirlet();draw();renderZoneList();
  }else if(DRAFT.length){toast("Alan için en az 3 nokta gerekir","warn");}
}
function delZone(i){ZONES.splice(i,1);kirlet();draw();renderZoneList();}
function renameZone(i,v){ZONES[i].name=v;kirlet();}
function flipDir(i){ZONES[i].direction=ZONES[i].direction==='BtoA'?'AtoB':'BtoA';kirlet();renderZoneList();}
/* Sınıf seçimi çizimden SONRA da değiştirilebilir: eskiden yanlış nesne seçilirse
   bölgeyi silip yeniden çizmek gerekiyordu. */
function toggleZoneClass(i,c){
  const z=ZONES[i],s=new Set(z.classes||[]);
  s.has(c)?s.delete(c):s.add(c);
  z.classes=[...s];kirlet();renderZoneList();
}
function vurgula(i){VURGU=i;draw();}
function renderZoneList(){
  const el=$("#zlist");if(!el)return;
  const say=$("#zcount");if(say)say.textContent=ZONES.length;
  if(!ZONES.length){
    el.innerHTML=`<div class="empty">Henüz çizim yok.<br><span class="mut-s">Soldaki araçtan birini seçin.</span></div>`;
    return;
  }
  const tur={line:["Çizgi — sayım","var(--warn-soft)","—"],zone:["Bölge — alan","var(--accent-soft)","▱"],
             intrusion:["İhlal alanı — alarm","var(--danger-soft)","⚠"]};
  el.innerHTML=ZONES.map((z,i)=>{const t=tur[z.kind]||["","var(--hover)","?"];
    const cls=(z.classes||[]);
    return `<div class="zrow" onmouseenter="vurgula(${i})" onmouseleave="vurgula(-1)">
    <span class="av" style="background:${t[1]};color:${COL[z.kind]};flex-shrink:0;">${t[2]}</span>
    <input value="${esc(z.name)}" oninput="renameZone(${i},this.value)" style="flex:1;min-width:120px;"/>

    <span style="display:inline-flex;gap:5px;flex-shrink:0;">
      <button class="clsbtn ${cls.includes('person')?'on':''}" title="bu bölgede insanları dikkate al" onclick="toggleZoneClass(${i},'person')">İnsan</button>
      <button class="clsbtn ${cls.includes('car')?'on':''}" title="bu bölgede araçları dikkate al" onclick="toggleZoneClass(${i},'car')">Araç</button></span>
    ${z.kind==='line'?`<button class="btn sm" title="giriş yönünü ters çevir" onclick="flipDir(${i})">${z.direction==='BtoA'?'B→A giriş':'A→B giriş'}</button>`:''}
    <button class="btn sm ico" title="sil" onclick="delZone(${i})">${svg('x',14)}</button></div>`}).join("");
}
function sideLabel(t,p,c){CX.beginPath();CX.arc(p[0],p[1],11,0,7);CX.fillStyle=c;CX.fill();CX.fillStyle="#fff";CX.font="bold 13px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText(t,p[0],p[1]);CX.textAlign="start";CX.textBaseline="alphabetic";}
function draw(){
  if(!CX)return;
  if(IMG&&IMG.complete&&IMG.naturalWidth)CX.drawImage(IMG,0,0,CV.width,CV.height);else{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);}
  ZONES.forEach((z,zi)=>{
    const c=COL[z.kind]||"#fff";const pts=z.points.map(px);
    const vur=zi===VURGU;   // listede üstüne gelinen bölge görüntüde belirginleşir
    CX.strokeStyle=c;CX.lineWidth=vur?6:3;CX.fillStyle=c+(vur?"66":"33");
    CX.shadowColor=vur?c:"transparent";CX.shadowBlur=vur?14:0;
    CX.beginPath();pts.forEach((p,i)=>i?CX.lineTo(p[0],p[1]):CX.moveTo(p[0],p[1]));
    if(z.kind!=="line"){CX.closePath();CX.fill();}CX.stroke();
    CX.shadowBlur=0;
    pts.forEach(p=>{CX.beginPath();CX.arc(p[0],p[1],6,0,7);CX.fillStyle="#fff";CX.fill();CX.lineWidth=2;CX.strokeStyle=c;CX.stroke();});
    if(z.kind==="line"&&pts.length===2){
      const mx=(pts[0][0]+pts[1][0])/2,my=(pts[0][1]+pts[1][1])/2;
      let dx=pts[1][0]-pts[0][0],dy=pts[1][1]-pts[0][1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const nx=-dy,ny=dx,OFF=26;
      const A=[mx-nx*OFF,my-ny*OFF],B=[mx+nx*OFF,my+ny*OFF];
      CX.strokeStyle=c;CX.lineWidth=2;CX.beginPath();CX.moveTo(A[0],A[1]);CX.lineTo(B[0],B[1]);CX.stroke();
      const ah=Math.atan2(B[1]-A[1],B[0]-A[0]);
      CX.save();CX.translate(B[0],B[1]);CX.rotate(ah);CX.fillStyle=c;CX.beginPath();CX.moveTo(0,0);CX.lineTo(-8,-4);CX.lineTo(-8,4);CX.closePath();CX.fill();CX.restore();
      sideLabel("A",A,c);sideLabel("B",B,c);
      CX.fillStyle=c;CX.font="bold 12px sans-serif";CX.fillText(z.name||"",pts[0][0]+8,pts[0][1]-8);
    }
    const[bx,by]=xBadge(z);CX.beginPath();CX.arc(bx,by,9,0,7);CX.fillStyle="#ef4444";CX.fill();
    CX.fillStyle="#fff";CX.font="bold 14px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText("×",bx,by);CX.textAlign="start";CX.textBaseline="alphabetic";
  });
  if(DRAWING){const a=px(DRAWING.a),b=px(DRAWING.b);CX.strokeStyle="#fff";CX.setLineDash([6,4]);CX.lineWidth=2;CX.beginPath();CX.moveTo(a[0],a[1]);CX.lineTo(b[0],b[1]);CX.stroke();CX.setLineDash([]);}
  if(DRAFT.length){CX.strokeStyle="#fff";CX.lineWidth=2;DRAFT.map(px).forEach((p,i,a)=>{CX.beginPath();CX.arc(p[0],p[1],4,0,7);CX.fillStyle="#fff";CX.fill();if(i){CX.beginPath();CX.moveTo(a[i-1][0],a[i-1][1]);CX.lineTo(p[0],p[1]);CX.stroke();}});}
}
async function saveZones(){
  const st=$("#zstatus");
  try{
    const r=await api("/zones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:window._zc,zones:ZONES})});
    if(r.ok){temizle();toast(`${r.count} çizim kaydedildi`);}
    else if(st){st.textContent="⚠ kaydedilemedi: "+(r.detail||"bilinmeyen hata");st.style.color="var(--danger)";}
  }catch(e){
    // 500 vb. JSON olmayan yanıtta api() fırlatır — kullanıcı sessiz kalmasın
    if(st)st.textContent="⚠ kaydedilemedi — tekrar deneyin (analiz sürüyorsa bitmesini beklemek gerekebilir)";
  }

/* Ekran değişince #trun/#tres kaybolur — null-guard'lı yazıcılar (poll sessiz sürer) */
const setRun=h=>{const el=$("#trun");if(el)el.innerHTML=h;};
const setRes=h=>{const el=$("#tres");if(el)el.innerHTML=h;};
/* Koşan job takibi: Durdur butonu + üst üste Çalıştır'da eski poll'un sessiz çıkışı için.
   Sunucu yeni /api/run'da eski job'ı zaten preempt eder — UI ayrıca iptal çağırmaz. */
let currentJobId=null,stopReqJob=null;
const setStopBtn=on=>{const b=$("#btnStop");if(b){b.style.display=on?"":"none";b.disabled=false;}};
async function stopTest(){
  if(!currentJobId)return;
  stopReqJob=currentJobId; // iptal sebebi ayrımı: kullanıcı durdurdu vs yeni test preempt etti
  const b=$("#btnStop");if(b)b.disabled=true;
  try{await api("/run/"+currentJobId,{method:"DELETE"});}catch(e){/* idempotent — sonucu poll işler */}
}
/* Nötr bilgi bandı (error kırmızısı DEĞİL) — durdurulan/iptal edilen test için */
const cancelBand=msg=>`<div class="card pad" style="display:flex;align-items:center;gap:12px;">
  <span class="av" style="background:var(--warn-soft);color:var(--warn);">${svg('stop',16)}</span>
  <div><div style="font-weight:700;">${esc(msg)}</div><div class="mut-s">Analiz sonlandırıldı.</div></div></div>`;
async function runTest(){
  const camera=window._tc,kind=window._tk;
  // Stale-loop koruması: her yeni çalıştırma sayacı artırır; eski poll döngüleri bayatlar ve sessizce çıkar
  window._runSeq=(window._runSeq||0)+1;const myRun=window._runSeq;
  setRun("başlıyor…");
  setRes(`<div class="card pad"><div class="skel" style="height:60px;border-radius:10px;"></div></div>`);
  try{
    const {job_id}=await api("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera,kind,realtime:window._trt!==false})});
    if(window._runSeq!==myRun)return; // bayat: yeni test başladı, panele dokunma
    currentJobId=job_id;setStopBtn(true);
    let st,shownSeq=-1;
    for(let i=0;i<1500;i++){
      st=await api("/run/"+job_id);
      if(window._runSeq!==myRun)return; // bayat döngü (fetch sonrası) — sessiz çık
      if(st.status==="done"||st.status==="error"||st.status==="cancelled"||st.cancelled)break; // "cancelling" geçicidir, beklemeye devam
      setRun(`<span style="color:var(--accent);">⏳ ${esc(st.stage||"çalışıyor")}…</span>`);
      ensureLivePanel();
      // Canlı annotated kare — yeni kare geldiyse (frame_seq arttıysa) img'i tazele
      if(st.frame_seq&&st.frame_seq!==shownSeq){shownSeq=st.frame_seq;const f=$("#liveframe");if(f){f.src=`/api/run/${job_id}/frame?seq=${st.frame_seq}${tokq()}`;f.style.display="block";const ph=$("#liveph");if(ph)ph.remove();}}
      // Metrikler görüntünün YANINDA akar; "analyze"da aktif aşamanın paneli gösterilir
      const stage=st.stage||"";
      if(stage.startsWith("Yüz")&&st.face_live)renderLiveFace(st.face_live);
      else if(stage.startsWith("Plaka")&&st.live)renderLive(st.live);
      else if(st.count_live)renderLiveCount(st.count_live);
      else if(st.face_live)renderLiveFace(st.face_live);
      else if(st.live&&st.live.length)renderLive(st.live);
      await new Promise(r=>setTimeout(r,150));
      if(window._runSeq!==myRun)return; // bayat döngü (bekleme sonrası) — sessiz çık
    }
    if(window._runSeq!==myRun)return; // bayat döngü — sessiz çık
    currentJobId=null;setStopBtn(false); // bu job bitti — Durdur gizlenir
    if(st&&(st.status==="cancelled"||st.cancelled)){
      const byUser=stopReqJob===job_id;stopReqJob=null;
      setRun(`<span class="mut-s">${esc(st.stage||"iptal edildi")}</span>`);
      setRes(cancelBand(byUser?"Test durduruldu":"Yeni test başlatıldı, önceki iptal edildi"));
      return;
    }
    if(!st||st.status==="error"){setRun("hata: "+esc(st?st.error:"zaman aşımı"));setRes("");return;}

    setRun("✓ bitti");
    renderResult(st.summary,st.videos);
  }catch(e){
    if(window._runSeq!==myRun)return; // bayat döngünün hatası güncel job'ı gölgelemesin
    currentJobId=null;setStopBtn(false);
    setRun("hata: "+esc(e));setRes("");
  }
}

const _tm=()=>$("#tmetrics")||$("#tres");
/* Canlı listeler ARTIMLI güncellenir: her poll'da innerHTML'i yeniden yazmak
   (150ms'de bir) tüm satırların giriş animasyonunu baştan tetikliyor ve liste
   sürekli yanıp sönüyordu. Artık iskele bir kez kurulur, yalnız YENİ satır eklenir;
   sayaçlar textContent ile yazılır (düğüm değişmez → yeniden boyama yok). */
const _DOM_ROW_CAP=200;   // uzun koşuda DOM sınırsız büyümesin
function _appendNew(rows, evs, keyf, html){
  if(!rows._keys)rows._keys=new Set();
  let eklendi=false;
  for(const ev of evs){
    const k=keyf(ev);
    if(rows._keys.has(k))continue;
    rows._keys.add(k);
    if(!eklendi&&rows.querySelector(".empty"))rows.innerHTML="";
    rows.insertAdjacentHTML("beforeend",html(ev));
    eklendi=true;
  }
  if(!eklendi)return false;
  while(rows.children.length>_DOM_ROW_CAP)rows.firstElementChild.remove();
  rows.scrollTop=rows.scrollHeight;
  return true;
}

  // Okunan plakalar — video altında alt alta liste (ANPR kaydı)

/* Göreli zaman: operatör "14:32:11" değil "3 dk önce" okur — tazelik anlık anlaşılır.
   Sunucu zamanları UTC; tz eki yoksa Z varsayılır (yerel saat sanılıp kayma olmasın). */
function gecenSure(t){
  if(!t)return "";
  const d=new Date(String(t).replace(" ","T")+(/[+Z]/.test(String(t).slice(10))?"":"Z"));
  if(isNaN(d))return esc(String(t));
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<60)return "az önce";
  if(s<3600)return `${Math.floor(s/60)} dk önce`;
  if(s<86400)return `${Math.floor(s/3600)} sa önce`;
  if(s<604800)return `${Math.floor(s/86400)} gün önce`;
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"});
}
/* ---- Kayıt arşivi: zaman çizelgesi + sıralı segment oynatıcı ----
   hls.js KULLANILMIYOR: çevrimdışı kurulumda CDN yok, kütüphaneyi repoya kopyalamak
   da bakım yükü. Segmentlerimiz düz mp4 olduğu için sıradaki dosyayı <video>'ya
   yüklemek yeterli — seek = doğru segmenti bul + içinde offset'e git. */
let REC={segler:[],gun:"",cam:""};
async function recYukle(cam,gun){
  // Gün sınırları YEREL saatte kurulup UTC'ye çevrilir: kayıtlar UTC saklanıyor,
  // operatör yerel saatle düşünüyor. Naif tarih göndermek gün kaymasına yol açıyordu.
  const bas=new Date(`${gun}T00:00:00`).toISOString();
  const bit=new Date(`${gun}T23:59:59.999`).toISOString();
  try{
    REC.segler=await api(`/recordings?camera=${encodeURIComponent(cam)}&start=${bas}&end=${bit}&limit=20000`);
  }catch(e){REC.segler=[];}
  REC.gun=gun;REC.cam=cam;
  const st=$("#rstat");
  const toplam=REC.segler.reduce((n,r)=>n+(+r.duration||0),0);
  if(st)st.textContent=REC.segler.length
    ? `${REC.segler.length} segment · ${(toplam/60).toFixed(1)} dakika kayıt`
    : "Bu gün için kayıt yok";
  recCiz();
  const cv=$("#rtl");
  if(cv){
    // Sürükleyerek arama: basılıyken imleç gezinir, bırakınca o ana atlanır.
    // (Salt onclick "dandik" kalıyordu — NVR'da scrub beklenir.)
    const ans=e=>{const r=cv.getBoundingClientRect();
      return Math.max(0,Math.min(86400,(e.clientX-r.left)/r.width*86400));};
    let basili=false;
    cv.onpointerdown=e=>{basili=true;cv.setPointerCapture(e.pointerId);
      REC.imlec=ans(e);recCiz();};
    cv.onpointermove=e=>{
      const t=ans(e);
      cv.title=recSaatYaz(t);
      if(basili){REC.imlec=t;recCiz();$("#rsaat").textContent=recSaatYaz(t);}};
    cv.onpointerup=e=>{basili=false;recOynat(ans(e));};
  }
  const v=$("#recvid");
  if(v){
    v.onended=()=>recSonraki();
    // İmleç oynatmayı takip eder — nerede olduğunu bant üstünde GÖR
    v.ontimeupdate=()=>{
      if(!REC.aktif)return;
      REC.imlec=_recSaniye(REC.aktif.start_time)+v.currentTime;
      $("#rsaat").textContent=recSaatYaz(REC.imlec);
      const p=$("#rpp");if(p)p.textContent=v.paused?"▶":"❚❚";
      if(!REC._cizZamani||Date.now()-REC._cizZamani>400){REC._cizZamani=Date.now();recCiz();}
    };
  }
  // Klavye: ←/→ 10 sn, Shift ile 60 sn, Boşluk oynat/duraklat (yalnız bu ekranda)
  document.onkeydown=e=>{
    if(active!=="rec"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
    if(e.key==="ArrowLeft"){e.preventDefault();recAtla(e.shiftKey?-60:-10);}
    else if(e.key==="ArrowRight"){e.preventDefault();recAtla(e.shiftKey?60:10);}
    else if(e.key===" "){e.preventDefault();recDurdurBaslat();}
  };
  if(window._rseek!=null){const t=window._rseek;window._rseek=null;recOynat(t,"geri");}
  else if(REC.segler.length)recOynat(_recSaniye(REC.segler[0].start_time));
}
const recSaatYaz=t=>{const x=Math.max(0,Math.round(t));
  return `${String(Math.floor(x/3600)).padStart(2,"0")}:${String(Math.floor(x%3600/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;};
function recAtla(delta){
  if(REC.imlec==null)return;
  recOynat(Math.max(0,Math.min(86400,REC.imlec+delta)),delta<0?"geri":"ileri");
}
function recDurdurBaslat(){
  const v=$("#recvid");if(!v)return;
  if(v.paused)v.play().catch(()=>{});else v.pause();
  const p=$("#rpp");if(p)p.textContent=v.paused?"▶":"❚❚";
}

function recSonaGit(){
  if(!REC.segler.length)return;
  const son=REC.segler[REC.segler.length-1];
  recOynat(_recSaniye(son.start_time)+Math.max(0,(+son.duration||0)-5));
}
const _recSaniye=t=>{const d=new Date(String(t).replace(" ","T"));
  return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();};
function recCiz(){
  const cv=$("#rtl");if(!cv)return;
  cv.width=cv.clientWidth||900;
  const cx=cv.getContext("2d"),W=cv.width,H=cv.height;
  cx.clearRect(0,0,W,H);
  // saat ızgarası
  cx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line")||"#333";
  for(let s=0;s<=24;s+=1){const x=W*s/24;cx.globalAlpha=s%6===0?.9:.35;
    cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
  cx.globalAlpha=1;
  // kayıt blokları
  cx.fillStyle=getComputedStyle(document.body).getPropertyValue("--accent")||"#4e8cc9";
  REC.segler.forEach(r=>{
    const b=_recSaniye(r.start_time),g=Math.max(1,(+r.duration||0)/86400*W);
    cx.fillRect(b/86400*W,8,g,H-16);
  });
  // oynatma imleci
  if(REC.imlec!=null){
    cx.fillStyle="#ef4444";cx.fillRect(REC.imlec/86400*W-1,0,2,H);
  }
}
function recBul(saniye,yon){
  // İstenen anı içeren segment; boşluktaysa yöne göre komşu:
  //   ileri (varsayılan) → sonraki segmentin başı
  //   geri              → önceki segmentin sonu (yoksa geri sarmak imkânsızdı)
  let sonraki=null,onceki=null;
  for(const r of REC.segler){
    const b=_recSaniye(r.start_time),s=+r.duration||0;
    if(saniye>=b&&saniye<b+s)return {r,offset:saniye-b};
    if(b>=saniye&&(sonraki===null||b<_recSaniye(sonraki.start_time)))sonraki=r;
    if(b<saniye&&(onceki===null||b>_recSaniye(onceki.start_time)))onceki=r;
  }
  if(yon==="geri"&&onceki)return {r:onceki,offset:Math.max(0,(+onceki.duration||0)-3)};
  return sonraki?{r:sonraki,offset:0}:(onceki?{r:onceki,offset:Math.max(0,(+onceki.duration||0)-3)}:null);
}
function recOynat(saniye,yon){
  const bul=recBul(saniye,yon);
  const v=$("#recvid");if(!v)return;
  if(!bul){toast("O anda kayıt yok","warn");return;}
  REC.aktif=bul.r;REC.imlec=_recSaniye(bul.r.start_time)+bul.offset;
  const yeni=`/media/rec/${bul.r.path}${tokq().replace("&","?")}`;
  if(!v.src.endsWith(bul.r.path.split("?")[0])){v.src=yeni;}
  v.currentTime=bul.offset;
  v.playbackRate=REC.hiz||1;   // hız seçimi segment geçişinde sıfırlanmasın
  v.play().catch(()=>{});
  const p=$("#rpp");if(p)p.textContent="❚❚";
  recCiz();
}
function recSonraki(){
  if(!REC.aktif)return;
  const i=REC.segler.indexOf(REC.aktif);
  if(i<0||i+1>=REC.segler.length)return;
  recOynat(_recSaniye(REC.segler[i+1].start_time));
}

/* Adreste kimlik bilgisi EKRANDA gösterilmez — güvenlik ürününde şifre omuz
   üstünden okunabilir olmamalı (sunucu da log/hata metninde aynısını maskeler). */
const maskUrl=s=>String(s??"").replace(/\/\/[^/@\s]+:[^/@\s]+@/,"//***:***@");
/* Listede adres sütunu: şemadan kaynak türü, gövdeden host:port. Kimlik bilgisi
   hiç ayrıştırılmaz — desen kullanıcı:şifre@ kısmını atlar, ekrana taşınamaz. */
function kaynakBilgi(s){
  s=String(s??"").trim();
  const m=/^([a-zA-Z][\w+.-]*):\/\/(?:[^/@\s]*@)?(\[[^\]\s]+\]|[^/:\s?]+)(?::(\d+))?/.exec(s);
  if(!m||m[1].toLowerCase()==="file")return{tur:"Dosya",adres:"—"};
  const sema=m[1].toLowerCase();
  const tur=sema==="rtsp"?"RTSP":(/\.m3u8(\?|$)/i.test(s)?"HLS":sema.toUpperCase());
  return{tur,adres:m[3]?m[2]+":"+m[3]:m[2]};
}

    el.classList.toggle("ok",durum==="ok");el.classList.toggle("on",durum!=="bos");};
  const sec=(ana,alt,ad)=>{
    adim("#st1","ok");adim("#st2","on");
    srcEl.value=ana;
    const sub=m.querySelector("#f-sub");
    if(sub&&alt&&alt!==ana){sub.value=alt;m.querySelector("details.adv")?.setAttribute("open","");}
    if(ad&&!adEl.value)adEl.value=ad;
    // Keşif adresi buldu → doğrulamayı KULLANICI TIKLAMADAN başlat.
    // Keşif "kamera bu adresi bildiriyor" der; açılacağını kanıtlamaz (RTSP portu
    // kapalı, kimlik farklı, codec desteksiz olabilir) — o yüzden test şart, ama
    // kullanıcıya ayrıca tıklatmaya gerek yok.
    toast("Adres bulundu, doğrulanıyor");
    m.querySelector("#f-test")?.click();
  };
  if(!duzenle){
    api("/discover/brands").then(r=>{
      const s=m.querySelector("#f-brand");
      if(s&&r.brands)s.insertAdjacentHTML("beforeend",r.brands.map(b=>`<option>${esc(b)}</option>`).join(""));
    }).catch(()=>{});

    m.querySelector("#f-scan").onclick=async ev=>{
      const b=ev.currentTarget;b.disabled=true;b.style.opacity=".6";
      bekle("Yerel ağ taranıyor — yalnız bu ağdaki cihazlar sorgulanır, internete istek gitmez…");
      try{
        const r=await api("/discover?timeout=5");
        if(!r.count){hata("Ağda kendini duyuran kamera bulunamadı. Kameranın ONVIF ayarı kapalı olabilir — IP adresini yazıp <b>Kameraya bağlan</b>, o da olmazsa <b>Bilinen adresleri dene</b> seçeneğini kullanın.");return;}
        disc.innerHTML=`<div class="card" style="margin-top:12px;">${r.devices.map(d=>`<div class="row">
          <span class="av" style="background:var(--accent-soft);color:var(--accent);">${svg('cams',16)}</span>
          <div style="flex:1;"><b class="mono">${esc(d.ip)}</b>${d.ekli?' <span class="chip" style="background:var(--hover);color:var(--ink-3);">zaten ekli</span>':''}
            <div class="mut-s mono" style="font-size:11px;">${esc((d.scopes||[]).join(" ").slice(0,90))}</div></div>
          <button class="btn sm" onclick="document.querySelector('#f-ip').value='${esc(d.ip)}';document.querySelector('#f-onvif').click();">Bu kameraya bağlan</button>
        </div>`).join("")}</div>`;
      }catch(e){hata(String(e));}
      finally{b.disabled=false;b.style.opacity="";}
    };

    m.querySelector("#f-onvif").onclick=async ev=>{
      const ip=m.querySelector("#f-ip").value.trim();
      if(!ip){toast("Önce kamera IP'sini girin","warn");return;}
      const b=ev.currentTarget;b.disabled=true;b.style.opacity=".6";
      bekle("Kameraya bağlanılıyor, yayın adresleri okunuyor…");
      try{
        const r=await api("/discover/onvif",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ip,username:m.querySelector("#f-user").value,password:m.querySelector("#f-pass").value})});
        if(!r.ok){hata(r.error||"bilinmeyen hata");return;}
        disc.innerHTML=`<div class="card" style="margin-top:12px;">
          <div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ok);">✓ Kamera ${r.profiller.length} görüntü akışı bildirdi</div>
          ${r.profiller.map(p=>`<div class="row"><div style="flex:1;"><b>${esc(p.ad)}</b>
            <div class="mut-s mono" style="font-size:11px;">${esc(p.cozunurluk)}</div></div>
            <button class="btn sm" onclick="document.querySelector('#f-src').value=${JSON.stringify(p.url).replace(/"/g,'&quot;')};toast('Adres forma yazıldı')">Ana akış yap</button></div>`).join("")}
          <div class="row" style="background:var(--panel-2);"><div style="flex:1;" class="mut-s">En yüksek çözünürlük ana görüntü, en düşüğü kamera duvarı için ayarlanır</div>
            <button class="btn sm pri" id="f-auto">Otomatik ayarla</button></div></div>`;
        m.querySelector("#f-auto").onclick=()=>sec(r.ana,r.alt,`Kamera ${ip.split(".").pop()}`);
      }catch(e){hata(String(e));}
      finally{b.disabled=false;b.style.opacity="";}
    };

    m.querySelector("#f-paths").onclick=async ev=>{
      const ip=m.querySelector("#f-ip").value.trim();
      if(!ip){toast("Önce kamera IP'sini girin","warn");return;}
      const b=ev.currentTarget;b.disabled=true;b.style.opacity=".6";
      bekle("Bu markaların bilinen kamera adresleri sırayla deneniyor — her biri için bağlantı kurulur, biraz sürebilir…");
      try{
        const r=await api("/discover/paths",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ip,username:m.querySelector("#f-user").value,password:m.querySelector("#f-pass").value,
                               brand:m.querySelector("#f-brand").value})});
        if(!r.count){hata("Denenen adreslerin hiçbiri açılmadı. Kullanıcı adı ve şifre doğru mu? Kamerada canlı yayın (RTSP) kapalı olabilir.");return;}
        disc.innerHTML=`<div class="card" style="margin-top:12px;">
          <div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ok);">✓ ${r.count} çalışan kamera adresi bulundu</div>
          ${r.found.map(f=>`<div class="row"><div style="flex:1;min-width:0;"><b>${esc(f.marka)}</b> <span class="mut-s">${esc(f.tip)}</span>
            <div class="mut-s mono" style="font-size:11px;">${esc(f.cozunurluk)} · ${esc(f.codec)} · ${esc(f.url)}</div></div>
            <button class="btn sm" onclick="document.querySelector('#f-src').value=${JSON.stringify(f._url).replace(/"/g,'&quot;')};toast('Adres forma yazıldı')">Kullan</button></div>`).join("")}</div>`;
      }catch(e){hata(String(e));}
      finally{b.disabled=false;b.style.opacity="";}
    };
  }

  m.querySelector("#f-test").onclick=async ev=>{
    const source=srcEl.value.trim();
    if(!source){toast("Önce kaynak adresini girin","warn");return;}
    const btn=ev.currentTarget;btn.disabled=true;btn.style.opacity=".6";
    out.innerHTML=`<div class="skel" style="height:72px;border-radius:var(--r);margin-bottom:14px;"></div>`;
    try{
      const r=await api("/cameras/probe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source})});
      // Doğrulama başarılıysa 2. adım tamamlandı, sıra adlandırmada
      adim("#st2",r.ok?"ok":"on");
      if(r.ok){adim("#st3","on");if(!adEl.value)adEl.focus();}
      out.innerHTML=r.ok
        ?`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;padding:13px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-lg);flex-wrap:wrap;">
            <img src="data:image/jpeg;base64,${r.preview}" style="width:190px;border-radius:var(--r);display:block;"/>
            <div><div style="font-weight:700;color:var(--ok);margin-bottom:5px;">✓ Bağlantı doğrulandı</div>
              <div class="mono mut-s">${r.width}×${r.height} · ${r.fps} fps · ${esc(r.codec)}</div>
              ${r.width>1280?'<div class="mut-s" style="margin-top:6px;">Yüksek çözünürlük — duvar için substream tanımlamanız önerilir.</div>':''}</div></div>`
        :`<div style="margin-bottom:14px;padding:13px;border:1px solid var(--danger);background:var(--danger-soft);border-radius:var(--r-lg);">
            <div style="font-weight:700;color:var(--danger);margin-bottom:4px;">Bağlanılamadı</div>
            <div class="mut-s">${esc(r.error||"bilinmeyen hata")}</div></div>`;
    }catch(e){out.innerHTML="";toast("Test başarısız: "+e,"err");}
    finally{btn.disabled=false;btn.style.opacity="";}
  };

  m.querySelector("#f-ok").onclick=async ev=>{
    const source=srcEl.value.trim(),name=adEl.value.trim(),source_sub=m.querySelector("#f-sub").value.trim();
    if(!source||!name){toast("Ad ve kaynak adresi zorunlu","warn");return;}
    // Doğrulanmamış adres kaydedilebilir ama SESSİZCE değil: sahada en sık
    // kaybedilen zaman "ekledim, siyah geliyor" turudur. Kullanıcı bilerek
    // atlıyorsa engellenmez — uyarılıp onayı alınır.
    if(!duzenle&&!m.querySelector("#st2")?.classList.contains("ok")){
      const devam=await confirmDialog("Adres doğrulanmadı",
        "Bu adrese bağlanılıp bağlanılamadığı denenmedi. Kamera görüntü vermezse bunu ancak canlı ekranda fark edersiniz.",
        "Yine de kaydet");
      if(!devam)return;
    }
    const btn=ev.currentTarget;btn.disabled=true;btn.style.opacity=".6";
    try{
      if(duzenle)await api("/cameras/"+encodeURIComponent(cam.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,source,source_sub})});
      else await api("/cameras",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,source,source_sub})});
      CAMS=await api("/cameras");kapat();SCREENS.cams();
      toast(duzenle?`"${name}" güncellendi`:`"${name}" eklendi`);
    }catch(e){toast("Kaydedilemedi: "+e,"err");btn.disabled=false;btn.style.opacity="";}
  };
}
/* Analiz worker'ı çalışıyor mu (sistem durumundan) — görev anahtarları YALNIZ onu
   yönlendirir; worker yoksa görev açmak hiçbir şey yapmaz. Bunu sessizce geçmek
   "plakayı okumadı" sanılmasına yol açıyordu. */
const workerCalisiyor=()=>!!(SYSDURUM?.bilesenler||[]).find(b=>b.ad==="Analiz worker"&&b.ok);
function workerUyarisi(){
  if(workerCalisiyor())return "";
  return `<div class="card pad" style="border-color:var(--warn);background:var(--warn-soft);margin-bottom:18px;display:flex;gap:13px;align-items:flex-start;">
    <span class="av" style="background:var(--warn);color:#fff;flex-shrink:0;">!</span>
    <div><div style="font-weight:700;">Analiz servisi çalışmıyor</div>
      <div class="mut-s" style="margin-top:4px;line-height:1.7;">Aşağıdaki Sayım / Plaka / Yüz anahtarları <b>sürekli analizi</b> yönetir; bu servis kapalıyken kamera görüntüsü izlenir ama <b>hiçbir olay üretilmez</b>. Tek seferlik deneme için <b>Test</b> ekranını kullanın.<br>
      Servisi başlatmak için: <span class="mono">python -m src.worker</span> ve <span class="mono">python -m src.ingestor</span></div></div></div>`;
}
async function toggleTask(cid,key){
  const c=CAMS.find(x=>x.id===cid);if(!c)return;
  const t=Object.assign({count:false,plate:false,face:false,record:true},c.tasks||{});t[key]=!t[key];
  const r=await api(`/cameras/${encodeURIComponent(cid)}/tasks`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks:t})});
  if(r&&r.ok){
    c.tasks=r.tasks;SCREENS.cams();
    // Görevi AÇARKEN worker yoksa kullanıcı bunu anında bilsin
    if(t[key]&&!workerCalisiyor())
      toast("Görev kaydedildi. Analiz servisi çalışmadığı için olay üretilmeyecek.","warn",8000);
  }
}
async function delCam(id,ad){
  if(!await confirmDialog("Kamerayı sil",
      `"${ad||id}" silinecek. Kayıtlı olaylar kalır ama kamera canlı izlemeden ve analizden çıkar.`))return;
  await api("/cameras/"+encodeURIComponent(id),{method:"DELETE"});
  CAMS=await api("/cameras");SCREENS.cams();toast(`"${ad||id}" silindi`);
}
async function addWatch(kind){
  const value=$("#w-val").value.trim();if(!value)return;
  const camera=kind==='face'&&$("#w-cam")?$("#w-cam").value:"";
  const r=await api("/lists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,value,label:$("#w-lab").value,list_type:$("#w-type").value,camera})});
  if(kind==='face'&&camera&&r&&!r.enrolled)toast("Bu karede yüz bulunamadı — kişi eklendi ama eşleştirme için yüz embedding'i yok.","warn",7000);
  SCREENS.lists();
}
async function delWatch(kind,id){await api(`/lists/${kind}/${id}`,{method:"DELETE"});SCREENS.lists();}

boot();
</script>
</body>
</html>
