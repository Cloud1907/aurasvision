<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AurasVision</title>
<script>try{var t=localStorage.getItem('vai-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --panel-2:#f7f9fc; --hover:#edf1f7;
    --ink:#111827; --ink-2:#4b596c; --ink-3:#8a96a8;
    --line:#dfe5ee; --line-2:#cfd8e6;
    --accent:#2563eb; --accent-2:#0891b2; --accent-soft:#e8f0ff; --accent-ink:#ffffff;
    --ok:#0f8a4b; --ok-soft:#e5f7ed; --warn:#b7791f; --warn-soft:#fff4d6; --danger:#d92d20; --danger-soft:#ffebe8;
    --rail:#070b12; --rail-2:#101827; --rail-ink:#d4dce8; --rail-ink-2:#7d8aa0; --rail-active:#172338;
    --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 28px rgba(17,24,39,.08);
    --shadow-lg:0 18px 44px rgba(17,24,39,.14);
    --r:10px; --r-lg:14px; --t:.16s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme=dark]{
    --bg:#070b12; --panel:#0e1521; --panel-2:#111b2a; --hover:#172235;
    --ink:#edf3fb; --ink-2:#a8b4c7; --ink-3:#6f7c91;
    --line:#1d2a3b; --line-2:#2d3b50;
    --accent:#38bdf8; --accent-2:#22d3ee; --accent-soft:#102c3d; --accent-ink:#06111c;
    --ok:#34d399; --ok-soft:#0c2a1d; --warn:#fbbf24; --warn-soft:#2e2410; --danger:#fb7185; --danger-soft:#30151d;
    --rail:#05070c; --rail-2:#0c1220; --rail-ink:#c6d1df; --rail-ink-2:#657489; --rail-active:#122033;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5;}
  ::selection{background:var(--accent-soft);}
  .app{display:flex;min-height:100vh;}
  .rail{width:264px;flex-shrink:0;background:linear-gradient(180deg,var(--rail),#080d16 58%,#05070c);color:var(--rail-ink);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.06);}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px;}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 12px 28px rgba(37,99,235,.28);}
  .brand b{font-size:17px;letter-spacing:0;color:#fff;font-weight:700;}
  .brand span{font-size:11px;color:var(--rail-ink-2);display:block;letter-spacing:.04em;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-ink-2);padding:15px 10px 6px;font-weight:700;}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--rail-ink);cursor:pointer;font-size:14px;transition:background var(--t),color var(--t),transform var(--t);position:relative;}
  .nav a:hover{background:var(--rail-2);color:#fff;transform:translateX(1px);}
  .nav a.on{background:linear-gradient(90deg,var(--rail-active),rgba(23,35,56,.72));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .nav a.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2);}
  .nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.9;}
  .rail-foot{border-top:1px solid var(--rail-2);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--rail-ink-2);font-weight:700;}
  .dot i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--rail-2);background:transparent;color:var(--rail-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);}
  .icon-btn:hover{background:var(--rail-2);color:#fff;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:22px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
  .topbar h1{font-size:25px;font-weight:700;letter-spacing:0;margin:0;}
  .topbar .sub{color:var(--ink-2);font-size:13px;margin:2px 0 0;}
  .content{padding:28px 34px 42px;animation:fade .22s ease;max-width:2200px;width:100%;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);}
  .card.pad{padding:20px;}
  .grid{display:grid;gap:18px;}
  .overview{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);min-height:92px;}
  .stat .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .stat .v{font-size:28px;line-height:1.1;font-weight:750;margin-top:8px;letter-spacing:0;}
  .stat .s{font-size:12px;color:var(--ink-2);margin-top:5px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 14px;}
  .section-head b{font-size:15px;}
  .taskset{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .taskpill{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--hover);color:var(--ink-3);}
  .taskpill.on{background:var(--accent-soft);color:var(--accent);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;}
  .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:#05070c;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t),border-color var(--t);}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease;}
  .tile img.loaded{opacity:1;}
  .tile .skel{position:absolute;inset:0;background:linear-gradient(100deg,var(--panel-2) 30%,var(--hover) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .tile .grad{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(transparent,rgba(0,0,0,.76));pointer-events:none;}
  .tile .nm{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .countbox{position:absolute;left:14px;top:12px;display:flex;gap:7px;background:rgba(5,9,16,.78);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;z-index:2;border:1px solid rgba(255,255,255,.12);}
  .countbox span{white-space:nowrap;}
  .live{position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(5,9,16,.78);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.12);}
  .live i{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .row{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background var(--t);}
  .row:last-child{border-bottom:0;}
  .row:hover{background:var(--panel-2);}
  .av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}
  .mut{color:var(--ink-2);}.mut-s{color:var(--ink-3);font-size:12.5px;}
  .btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:all var(--t);}
  .btn:hover{background:var(--hover);border-color:var(--ink-3);}
  .btn:active{transform:scale(.97);}
  .btn svg{width:16px;height:16px;}
  .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 22%,transparent);}
  .btn.pri:hover{filter:brightness(1.04);}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn.ico{padding:8px;}
  input,select{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;transition:border var(--t),box-shadow var(--t);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input::placeholder{color:var(--ink-3);}
  .chip{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .metric{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);}
  .metric .k{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;}
  .metric .v{font-size:28px;font-weight:750;letter-spacing:0;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  tr:last-child td{border-bottom:0;}
  .tools{display:flex;flex-direction:column;gap:12px;width:220px;flex-shrink:0;}
  canvas{border-radius:var(--r-lg);border:1px solid var(--line-2);cursor:crosshair;max-width:100%;background:#0b1120;box-shadow:var(--shadow);}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--ink-2);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:all var(--t);}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);}
  .empty{padding:40px;text-align:center;color:var(--ink-3);}
  @media (max-width:1100px){.app{display:block}.rail{position:relative;width:auto;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.rail-foot{margin-top:14px}.overview{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr}.topbar,.content{padding-left:18px;padding-right:18px;}}
  @media (min-width:1800px){body{font-size:15px}.topbar h1{font-size:29px}.tiles{grid-template-columns:repeat(auto-fit,minmax(520px,1fr));}.content{padding-top:34px}.stat .v{font-size:34px;}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="logo" id="logo"></span><div><b>AurasVision</b><span>Görüntü analitiği</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <span class="dot"><i></i> sistem aktif</span>
      <button class="icon-btn" id="theme" onclick="toggleTheme()" aria-label="tema"></button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><div><h1 id="ttl">—</h1><p class="sub" id="tsub"></p></div><div id="tact"></div></div>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
/* ---- ikonlar (inline svg, bağımsız) ---- */
const IC={
  live:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  cams:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  zones:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  test:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  events:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.5 21a1.5 1.5 0 0 0 3 0"/>',
  lists:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/>',
};
const svg=(n,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
document.getElementById('logo').innerHTML=svg('bolt',18);

const NAV=[["live","Canlı","live"],["cams","Kameralar","cams"],["zones","Bölgeler","zones"],["test","Test","test"],["events","Olaylar","events"],["lists","Listeler","lists"]];
const TITLES={live:["Canlı görünüm","Tüm kameralar gerçek zamanlı"],cams:["Kameralar","IP / RTSP kaynakları"],zones:["Bölgeler ve çizgiler","Görüntüye çiz · sürükle düzelt · ✕ sil"],test:["Test ve çalıştır","Analizi çalıştır, sonucu ve videoyu gör"],events:["Olaylar","Birleşik akış — sayım · plaka · yüz"],lists:["İzleme listeleri","Kara liste / VIP — eşleşince uyarı"]};
let CAMS=[],active="live";
let LIVE_COUNTS={},LIVE_ACTIVE=false;
const $=s=>document.querySelector(s);
/* XSS koruması: kullanıcı/OCR kaynaklı her değer innerHTML'e esc() ile girer */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Erişim anahtarı (AURAS_TOKEN): 401 gelirse bir kez sorulur, localStorage'da tutulur */
let TOKEN=localStorage.getItem('vai-token')||'';
const tokq=()=>TOKEN?'&token='+encodeURIComponent(TOKEN):'';
async function api(p,o={}){
  o.headers=Object.assign({},o.headers||{},TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  const r=await fetch("/api"+p,o);
  if(r.status===401){
    const t=prompt("Erişim anahtarı (AURAS_TOKEN):");
    if(t){TOKEN=t;localStorage.setItem('vai-token',t);return api(p,o);}
    throw new Error("yetkisiz");
  }
  return r.json();
}
const snap=id=>"/api/snapshot?camera="+encodeURIComponent(id)+tokq();

function toggleTheme(){const d=document.documentElement;const nx=(d.getAttribute('data-theme')==='dark')?'light':'dark';d.setAttribute('data-theme',nx);try{localStorage.setItem('vai-theme',nx);}catch(e){}themeBtn();}
function themeBtn(){const dark=document.documentElement.getAttribute('data-theme')==='dark';$("#theme").innerHTML=svg(dark?'sun':'moon',17);}

let SYS={go2rtc:""};
async function boot(){themeBtn();[CAMS,SYS]=await Promise.all([api("/cameras"),api("/sysinfo").catch(()=>({go2rtc:""}))]);render();startLiveCounts();}
/* Sayaç kutuları yalnız bir analiz KOŞARKEN görünür — ekran ilk açılışta eski toplamlarla dolmaz */
function countBox(id){const c=LIVE_COUNTS[id];if(!LIVE_ACTIVE||!c)return `<div class="countbox" data-countbox="${esc(id)}" style="display:none;"></div>`;return `<div class="countbox" data-countbox="${esc(id)}"><span>${c.in} giriş</span><span>${c.out} çıkış</span></div>`;}
async function refreshLiveCounts(){try{const res=await api("/counts");LIVE_ACTIVE=!!res.active;const rows=res.rows||[];const next={};rows.forEach(r=>{next[r.camera_id]={in:Number(r.in_count||0),out:Number(r.out_count||0)};});LIVE_COUNTS=next;document.querySelectorAll("[data-countbox]").forEach(el=>{el.outerHTML=countBox(el.dataset.countbox);});const ov=document.querySelector(".overview");if(ov)ov.outerHTML=overviewStats();}catch(e){}}
function startLiveCounts(){clearInterval(window._countTimer);refreshLiveCounts();window._countTimer=setInterval(refreshLiveCounts,2000);}
function taskPills(c){const t=c.tasks||{};return `<span class="taskset"><span class="taskpill ${t.count?'on':''}">Sayım</span><span class="taskpill ${t.plate?'on':''}">Plaka</span><span class="taskpill ${t.face?'on':''}">Yüz</span></span>`;}
function overviewStats(){const activeTasks=CAMS.reduce((n,c)=>n+Object.values(c.tasks||{}).filter(Boolean).length,0);const inTotal=LIVE_ACTIVE?Object.values(LIVE_COUNTS).reduce((n,c)=>n+(c.in||0),0):"—";const outTotal=LIVE_ACTIVE?Object.values(LIVE_COUNTS).reduce((n,c)=>n+(c.out||0),0):"—";const sub=LIVE_ACTIVE?"canlı sayaç":"analiz çalışırken";return `<div class="overview"><div class="stat"><div class="k">Kamera</div><div class="v">${CAMS.length}</div><div class="s">tanımlı kaynak</div></div><div class="stat"><div class="k">Aktif görev</div><div class="v">${activeTasks}</div><div class="s">sayım, plaka, yüz</div></div><div class="stat"><div class="k">Toplam giriş</div><div class="v">${inTotal}</div><div class="s">${sub}</div></div><div class="stat"><div class="k">Toplam çıkış</div><div class="v">${outTotal}</div><div class="s">${sub}</div></div></div>`;}
function render(){
  $("#nav").innerHTML=`<div class="lbl">İzleme</div>`+NAV.slice(0,4).map(navHtml).join("")+`<div class="lbl">Kayıt</div>`+NAV.slice(4).map(navHtml).join("");
  clearInterval(window._liveTimer);
  const t=TITLES[active];$("#ttl").textContent=t[0];$("#tsub").textContent=t[1];$("#tact").innerHTML="";
  const c=$("#content");c.style.animation="none";void c.offsetWidth;c.style.animation="";
  SCREENS[active]();
}
const navHtml=n=>`<a class="${n[0]===active?'on':''}" onclick="go('${n[0]}')">${svg(n[2])}<span>${n[1]}</span></a>`;
function go(id){active=id;render();}

const SCREENS={
  live(){
    // go2rtc varsa gerçek canlı akış (MSE/WebRTC player), yoksa 5 sn'de bir snapshot
    const inner=c=>SYS.go2rtc
      ?`<iframe src="${SYS.go2rtc}/stream.html?src=${encodeURIComponent(c.id)}&mode=mse" style="width:100%;height:100%;border:0;" allow="autoplay" loading="lazy"></iframe>`
      :`<div class="skel"></div><img loading="lazy" src="${snap(c.id)}" data-cam="${esc(c.id)}" alt="${esc(c.name)}"
             onload="this.classList.add('loaded');this.previousElementSibling.remove()"/>`;
    $("#content").innerHTML=`${overviewStats()}<div class="section-head"><b>Kamera duvarı</b><span class="mut-s">Yüksek çözünürlüklü canlı izleme</span></div><div class="tiles">${CAMS.map(c=>`
      <div class="tile">
        ${inner(c)}
        <div class="grad"></div>
        <span class="live"><i></i> CANLI</span>
        <span class="nm">${esc(c.name)} ${taskPills(c)}</span>
        ${countBox(c.id)}
      </div>`).join("")}</div>`;
    clearInterval(window._liveTimer);
    if(!SYS.go2rtc)window._liveTimer=setInterval(()=>{document.querySelectorAll('.tile img').forEach(im=>{im.src=snap(im.dataset.cam)+'&t='+Date.now();});},5000);
  },
  async cams(){
    // worker heartbeat'inden gerçek durum (15 sn'den taze = çalışıyor)
    let hs={};try{(await api("/health")).forEach(h=>hs[h.camera_id]=h);}catch(e){}
    const stChip=c=>{const h=hs[c.id];
      if(!h)return '<span class="chip" style="background:var(--hover);color:var(--ink-3);">worker yok</span>';
      const fresh=(Date.now()-new Date(h.time.replace(' ','T')+(h.time.includes('+')?'':'Z')))<15000;
      if(!fresh)return '<span class="chip" style="background:var(--hover);color:var(--ink-3);">boşta</span>';
      if(h.status==='error')return '<span class="chip" style="background:var(--danger-soft);color:var(--danger);">hata</span>';

/* ---- bölge editörü ---- */
let TOOL="line", ZONES=[], DRAFT=[], IMG=null, CV=null, CX=null, DRAG=null, DRAWING=null;
const COL={line:"#f59e0b",zone:"#8b5cf6",intrusion:"#ef4444"};
function setTool(t){TOOL=t;["line","zone","intrusion"].forEach(x=>document.getElementById("t-"+x)?.classList.toggle("on",x===t));DRAFT=[];DRAWING=null;draw();}
function curClasses(){const c=[];if($("#c-person")?.checked)c.push("person");if($("#c-car")?.checked)c.push("car");return c;}
function defName(kind){const n=ZONES.filter(z=>z.kind===kind).length+1;return (kind==="line"?"Çizgi ":kind==="zone"?"Bölge ":"İhlal ")+n;}
async function initEditor(camId){
  CV=$("#cv");CX=CV.getContext("2d");DRAFT=[];DRAWING=null;DRAG=null;
  const z=await api("/zones?camera="+encodeURIComponent(camId));
  // API points/classes'ı parse edilmiş dizi döndürür (eski string formatı da tolere edilir)
  const arr=v=>typeof v==='string'?JSON.parse(v||"[]"):(v||[]);
  ZONES=z.map(x=>({kind:x.kind,name:x.name||defName(x.kind),points:arr(x.points),classes:arr(x.classes),direction:x.direction||'AtoB'}));
  IMG=new Image();
  IMG.onload=()=>{draw();renderZoneList();};
  IMG.onerror=()=>{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);CX.fillStyle="#64748b";CX.fillText("snapshot alınamadı",240,180);};
  IMG.src=snap(camId)+"&t="+Date.now();
  CV.onmousedown=onDown;CV.onmousemove=onMove;window.onmouseup=onUp;
  renderZoneList();
}
function evNorm(e){const r=CV.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];}
function px(p){return [p[0]*CV.width,p[1]*CV.height];}
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hitHandle(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){const z=ZONES[zi];for(let pi=0;pi<z.points.length;pi++){const[hx,hy]=px(z.points[pi]);if(dist(x*CV.width,y*CV.height,hx,hy)<11)return{zi,pi};}}return null;}
function xBadge(z){const p=px(z.points[z.points.length-1]);return[p[0]+15,p[1]-15];}
function hitX(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){if(!ZONES[zi].points.length)continue;const[bx,by]=xBadge(ZONES[zi]);if(dist(x*CV.width,y*CV.height,bx,by)<11)return zi;}return null;}
function onDown(e){
  const[x,y]=evNorm(e);
  const xi=hitX(x,y);if(xi!=null){ZONES.splice(xi,1);draw();renderZoneList();return;}
  const h=hitHandle(x,y);if(h){DRAG=h;return;}
  if(TOOL==="line"){DRAWING={a:[x,y],b:[x,y]};}
  else{DRAFT.push([x,y]);draw();}
}
function onMove(e){
  if(!DRAG&&!DRAWING)return;
  const[x,y]=evNorm(e);
  if(DRAG){ZONES[DRAG.zi].points[DRAG.pi]=[x,y];draw();}
  else if(DRAWING){DRAWING.b=[x,y];draw();}
}
function onUp(){
  if(DRAWING){const d=dist(DRAWING.a[0],DRAWING.a[1],DRAWING.b[0],DRAWING.b[1]);
    if(d>0.03){ZONES.push({kind:"line",name:defName("line"),points:[DRAWING.a,DRAWING.b],classes:curClasses(),direction:"AtoB"});renderZoneList();}
    DRAWING=null;draw();}
  if(DRAG){DRAG=null;renderZoneList();}
}
function finishPoly(){if((TOOL==="zone"||TOOL==="intrusion")&&DRAFT.length>=3){ZONES.push({kind:TOOL,name:defName(TOOL),points:DRAFT.slice(),classes:curClasses(),direction:""});DRAFT=[];draw();renderZoneList();}}
function delZone(i){ZONES.splice(i,1);draw();renderZoneList();}
function renameZone(i,v){ZONES[i].name=v;}
function flipDir(i){ZONES[i].direction=ZONES[i].direction==='BtoA'?'AtoB':'BtoA';renderZoneList();}
function renderZoneList(){
  const el=$("#zlist");if(!el)return;
  if(!ZONES.length){el.innerHTML='<span class="mut-s">Henüz çizim yok. Çizgi için görüntüde bas-çek yap.</span>';return;}
  el.innerHTML=ZONES.map((z,i)=>`<div class="row" style="padding-left:0;padding-right:0;">
    <span class="av" style="background:${z.kind==='line'?'var(--warn-soft)':z.kind==='zone'?'var(--accent-soft)':'var(--danger-soft)'};color:${COL[z.kind]};">${z.kind==='line'?'—':z.kind==='intrusion'?'⚠':'▱'}</span>
    <input value="${esc(z.name)}" oninput="renameZone(${i},this.value)" style="flex:1;"/>
    ${z.kind==='line'?`<button class="btn sm" title="giriş yönünü ters çevir" onclick="flipDir(${i})">${z.direction==='BtoA'?'B→A giriş':'A→B giriş'}</button>`:`<span class="mut-s">${z.kind==='intrusion'?'ihlal alanı':'alan'}</span>`}
    <button class="btn sm ico" title="sil" onclick="delZone(${i})">${svg('x',14)}</button></div>`).join("");
}
function sideLabel(t,p,c){CX.beginPath();CX.arc(p[0],p[1],11,0,7);CX.fillStyle=c;CX.fill();CX.fillStyle="#fff";CX.font="bold 13px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText(t,p[0],p[1]);CX.textAlign="start";CX.textBaseline="alphabetic";}
function draw(){
  if(!CX)return;
  if(IMG&&IMG.complete&&IMG.naturalWidth)CX.drawImage(IMG,0,0,CV.width,CV.height);else{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);}
  ZONES.forEach(z=>{
    const c=COL[z.kind]||"#fff";const pts=z.points.map(px);
    CX.strokeStyle=c;CX.lineWidth=3;CX.fillStyle=c+"33";
    CX.beginPath();pts.forEach((p,i)=>i?CX.lineTo(p[0],p[1]):CX.moveTo(p[0],p[1]));
    if(z.kind!=="line"){CX.closePath();CX.fill();}CX.stroke();
    pts.forEach(p=>{CX.beginPath();CX.arc(p[0],p[1],6,0,7);CX.fillStyle="#fff";CX.fill();CX.lineWidth=2;CX.strokeStyle=c;CX.stroke();});
    if(z.kind==="line"&&pts.length===2){
      const mx=(pts[0][0]+pts[1][0])/2,my=(pts[0][1]+pts[1][1])/2;
      let dx=pts[1][0]-pts[0][0],dy=pts[1][1]-pts[0][1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const nx=-dy,ny=dx,OFF=26;
      const A=[mx-nx*OFF,my-ny*OFF],B=[mx+nx*OFF,my+ny*OFF];
      CX.strokeStyle=c;CX.lineWidth=2;CX.beginPath();CX.moveTo(A[0],A[1]);CX.lineTo(B[0],B[1]);CX.stroke();
      const ah=Math.atan2(B[1]-A[1],B[0]-A[0]);
      CX.save();CX.translate(B[0],B[1]);CX.rotate(ah);CX.fillStyle=c;CX.beginPath();CX.moveTo(0,0);CX.lineTo(-8,-4);CX.lineTo(-8,4);CX.closePath();CX.fill();CX.restore();
      sideLabel("A",A,c);sideLabel("B",B,c);
      CX.fillStyle=c;CX.font="bold 12px sans-serif";CX.fillText(z.name||"",pts[0][0]+8,pts[0][1]-8);
    }
    const[bx,by]=xBadge(z);CX.beginPath();CX.arc(bx,by,9,0,7);CX.fillStyle="#ef4444";CX.fill();
    CX.fillStyle="#fff";CX.font="bold 14px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText("×",bx,by);CX.textAlign="start";CX.textBaseline="alphabetic";
  });
  if(DRAWING){const a=px(DRAWING.a),b=px(DRAWING.b);CX.strokeStyle="#fff";CX.setLineDash([6,4]);CX.lineWidth=2;CX.beginPath();CX.moveTo(a[0],a[1]);CX.lineTo(b[0],b[1]);CX.stroke();CX.setLineDash([]);}
  if(DRAFT.length){CX.strokeStyle="#fff";CX.lineWidth=2;DRAFT.map(px).forEach((p,i,a)=>{CX.beginPath();CX.arc(p[0],p[1],4,0,7);CX.fillStyle="#fff";CX.fill();if(i){CX.beginPath();CX.moveTo(a[i-1][0],a[i-1][1]);CX.lineTo(p[0],p[1]);CX.stroke();}});}
}
async function saveZones(){
  const st=$("#zstatus");
  try{
    const r=await api("/zones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:window._zc,zones:ZONES})});
    if(st)st.textContent=r.ok?`✓ ${r.count} kayıt kaydedildi`:"⚠ kaydedilemedi: "+(r.detail||"bilinmeyen hata");
  }catch(e){
    // 500 vb. JSON olmayan yanıtta api() fırlatır — kullanıcı sessiz kalmasın
    if(st)st.textContent="⚠ kaydedilemedi — tekrar deneyin (analiz sürüyorsa bitmesini beklemek gerekebilir)";
  }
}

/* Ekran değişince #trun/#tres kaybolur — null-guard'lı yazıcılar (poll sessiz sürer) */
const setRun=h=>{const el=$("#trun");if(el)el.innerHTML=h;};
const setRes=h=>{const el=$("#tres");if(el)el.innerHTML=h;};
async function runTest(){
  const camera=window._tc,kind=window._tk;
  setRun("başlıyor…");
  setRes(`<div class="card pad"><div class="skel" style="height:60px;border-radius:10px;"></div></div>`);
  try{
    const {job_id}=await api("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera,kind})});
    let st,shownSeq=-1;
    for(let i=0;i<1500;i++){
      st=await api("/run/"+job_id);
      if(st.status==="done"||st.status==="error")break;
      setRun(`<span style="color:var(--accent);">⏳ ${esc(st.stage||"çalışıyor")}…</span>`);
      ensureLivePanel();
      // Canlı annotated kare — yeni kare geldiyse (frame_seq arttıysa) img'i tazele
      if(st.frame_seq&&st.frame_seq!==shownSeq){shownSeq=st.frame_seq;const f=$("#liveframe");if(f){f.src=`/api/run/${job_id}/frame?seq=${st.frame_seq}${tokq()}`;f.style.display="block";const ph=$("#liveph");if(ph)ph.remove();}}
      // Metrikler görüntünün YANINDA akar; "analyze"da aktif aşamanın paneli gösterilir
      const stage=st.stage||"";
      if(stage.startsWith("Yüz")&&st.face_live)renderLiveFace(st.face_live);
      else if(stage.startsWith("Plaka")&&st.live)renderLive(st.live);
      else if(st.count_live)renderLiveCount(st.count_live);
      else if(st.face_live)renderLiveFace(st.face_live);
      else if(st.live&&st.live.length)renderLive(st.live);
      await new Promise(r=>setTimeout(r,300));
    }
    if(!st||st.status==="error"){setRun("hata: "+esc(st?st.error:"zaman aşımı"));setRes("");return;}

    setRun("✓ bitti");
    renderResult(st.summary,st.videos);
  }catch(e){setRun("hata: "+esc(e));setRes("");}
}
/* Canlı analiz paneli: üstte annotated kare, altında akan metrikler — bir kez kurulur */
function ensureLivePanel(){
  if($("#tlive")||!$("#tres"))return;
  // Yan yana: görüntü solda (sınırlı boy), sayaçlar sağda — geçişler görüntüyle birlikte okunur
  $("#tres").innerHTML=`<div id="tlive" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;">
    <div class="card pad" style="flex:1.3 1 380px;min-width:320px;">

      <div id="liveph" class="skel" style="height:220px;border-radius:var(--r-lg);"></div>
      <img id="liveframe" alt="" style="width:100%;max-height:420px;object-fit:contain;display:none;border-radius:var(--r-lg);border:1px solid var(--line);background:#000;box-shadow:var(--shadow);">
    </div>
    <div id="tmetrics" style="flex:1 1 300px;min-width:280px;"></div>
  </div>`;
}
const _tm=()=>$("#tmetrics")||$("#tres");
function renderLiveCount(live){
  const rows=(live.events||[]).slice(-40).map(ev=>`<div class="row" style="animation:fade .2s ease;">
    <span class="av" style="background:${ev.direction==='in'?'var(--ok-soft)':'var(--warn-soft)'};color:${ev.direction==='in'?'var(--ok)':'var(--warn)'};">${ev.direction==='in'?'IN':'OUT'}</span>
    <div style="flex:1;"><div style="font-weight:700;">${esc(ev.line||'Çizgi')} · ${ev.direction==='in'?'giriş':'çıkış'}</div><div class="mono mut-s">track ${ev.track_id} · kare ${ev.frame_idx} · ${ev.ts_seconds} sn</div></div>
  </div>`).join("");
  const tgt=_tm();if(!tgt)return;
  tgt.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:14px;"><div class="metric"><div class="k">Canlı sayım · giriş</div><div class="v">${live.in||0}</div></div><div class="metric"><div class="k">Canlı sayım · çıkış</div><div class="v">${live.out||0}</div></div></div><div class="card"><div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;">${svg('live',17)} Canlı sayım akışı <span class="chip" style="background:var(--accent-soft);color:var(--accent);">${(live.events||[]).length}</span></div><div id="liverows" style="max-height:340px;overflow:auto;">${rows||'<div class="empty">Geçiş bekleniyor.</div>'}</div></div>`;
  const lr=$("#liverows");if(lr)lr.scrollTop=lr.scrollHeight;
}
function renderLiveFace(live){
  const matches=(live.matches||[]).map(m=>`<div class="row"><span class="av" style="background:var(--danger-soft);color:var(--danger);">!</span><div style="flex:1;"><div style="font-weight:700;">${esc(m.name)}</div><div class="mut-s">${esc(m.label||'')} · ${esc(m.list_type||'')}</div></div><span class="mono mut-s">${m.score}</span></div>`).join("");
  const tgt=_tm();if(!tgt)return;
  tgt.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px;"><div class="metric"><div class="k">Canlı yüz · ham tespit</div><div class="v">${live.raw||0}</div><div class="mut-s">işlenen kare ${live.frames||0}</div></div><div class="metric"><div class="k">Aktif yüz track</div><div class="v">${live.active||0}</div><div class="mut-s">sahnede izlenen</div></div><div class="metric"><div class="k">Net kişi</div><div class="v">${live.detections||0}</div><div class="mut-s">track kapanınca artar</div></div><div class="metric"><div class="k">Demografi</div><div class="v">${live.male||0} / ${live.female||0}</div><div class="mut-s">E / K · yaş ${live.avg_age||0}</div></div></div><div class="card"><div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px;">${svg('events',17)} Canlı yüz akışı</div>${matches||'<div class="empty">Yüz izleniyor. Eşleşme veya kapanan track bekleniyor.</div>'}</div>`;
}
function renderLive(live){
  const rows=live.slice(-40).map((r,i)=>`<div class="row" style="animation:fade .2s ease;">
    <span class="av" style="background:var(--warn-soft);color:var(--warn);">${svg('cams',16)}</span>
    <div style="flex:1;"><span class="mono" style="font-weight:500;">${esc(r.plate)}</span></div>
    <span class="mut-s">kare ${r.frame} · ${r.ts} sn${r.conf!=null?' · %'+Math.round(r.conf*100):''}</span></div>`).join("");
  const tgt=_tm();if(!tgt)return;
  tgt.innerHTML=`<div class="card"><div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:500;">${svg('cams',17)} Canlı plaka akışı <span class="chip" style="background:var(--accent-soft);color:var(--accent);">${rows?live.length:0}</span></div><div id="liverows" style="max-height:340px;overflow:auto;">${rows||'<div class="empty">Plaka bekleniyor.</div>'}</div></div>`;
  const lr=$("#liverows");if(lr)lr.scrollTop=lr.scrollHeight;
}
function renderResult(s,videos){
  const m=[];
  if(s.count){const ls=s.count.lines||[];
    const perline=ls.length?`<div class="mut-s" style="margin-top:8px;line-height:1.9;">${ls.map(l=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px;"></span>${esc(l.name)}: <b>${l.in}</b> giriş / <b>${l.out}</b> çıkış`).join("<br>")}</div>`:'';
    m.push(`<div class="metric"><div class="k">Sayım · A→B giriş / B→A çıkış${ls.length>1?' · '+ls.length+' çizgi':''}</div><div class="v">${s.count.in} <span class="mut" style="font-size:15px;">giriş</span> · ${s.count.out} <span class="mut" style="font-size:15px;">çıkış</span></div><div class="mut-s">${s.count.frames} kare</div>${perline}</div>`);}
  if(s.plate){const al=s.plate.alerts||[],vt=s.plate.voted||[];
    const list=vt.length?vt.slice(0,10).map(v=>`${esc(v.plate)}<span class="mut-s"> ×${v.count}</span>`).join(" · "):(s.plate.plates||[]).slice(0,10).map(esc).join(" · ");
    m.push(`<div class="metric" ${al.length?'style="border:1px solid var(--danger);"':''}><div class="k">Plaka · ${s.plate.total} okuma → ${vt.length} araç (oylama)</div><div class="mono" style="margin-top:4px;font-size:13px;line-height:1.9;">${list||'—'}</div>${al.length?`<div class="chip" style="background:var(--danger-soft);color:var(--danger);margin-top:8px;">⚠ ${al.length} kara liste: ${esc(al.map(a=>a.plate).join(", "))}</div>`:''}</div>`);}
  if(s.face){const al=s.face.alerts||[];m.push(`<div class="metric" ${al.length?'style="border:1px solid var(--danger);"':''}><div class="k">Yüz (anonim) · kişi</div><div class="v">${s.face.detections}</div><div class="mut-s">E:${s.face.male} · K:${s.face.female} · ort. yaş ${s.face.avg_age}</div>${al.length?`<div class="chip" style="background:var(--danger-soft);color:var(--danger);margin-top:8px;">⚠ ${al.length} liste eşleşmesi: ${esc(al.map(a=>a.name).join(", "))}</div>`:''}</div>`);}
  const cb="?t="+Date.now()+tokq();  // cache-buster + erişim anahtarı
  const vids=(videos||[]).map((v,i)=>`<div class="card pad" style="margin-top:14px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;"><div style="font-weight:700;display:flex;align-items:center;gap:8px;">${svg('play',17)} Sonuç videosu ${videos.length>1?i+1:''}</div><a class="btn sm" href="${v}${cb}" target="_blank" rel="noopener">Yeni sekmede aç</a></div><video src="${v}${cb}" controls preload="metadata" style="width:100%;display:block;border-radius:var(--r-lg);border:1px solid var(--line);background:#000;box-shadow:var(--shadow);"></video></div>`).join("");
  // Okunan plakalar — video altında alt alta liste (ANPR kaydı)
  let plateList="";
  if(s.plate){const vt=s.plate.voted||[];const bl=new Set((s.plate.alerts||[]).map(a=>a.plate));
    plateList=`<div class="card" style="margin-top:14px;"><div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px;">${svg('cams',17)} Okunan plakalar <span class="chip" style="background:var(--accent-soft);color:var(--accent);">${vt.length}</span></div>`+
      (vt.length?vt.map(v=>{const black=bl.has(v.plate);return `<div class="row">
        <span class="av" style="background:${black?'var(--danger-soft)':'var(--warn-soft)'};color:${black?'var(--danger)':'var(--warn)'};">${black?'!':svg('cams',16)}</span>
        <div style="flex:1;"><span class="mono" style="font-size:15px;font-weight:500;">${esc(v.plate)}</span> <span class="mut-s">×${v.count}</span></div>
        ${black?'<span class="chip" style="background:var(--danger-soft);color:var(--danger);">kara liste</span>':''}
        <span class="mut-s">${v.conf!=null?'%'+Math.round(v.conf*100):''}</span></div>`}).join(""):'<div class="empty">Plaka okunmadı.</div>')+`</div>`;}
  setRes(`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">${m.join("")}</div>${vids}${plateList}`);
}
async function addCam(){const name=$("#cam-name").value.trim(),source=$("#cam-src").value.trim();if(!name||!source)return;await api("/cameras",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,source})});CAMS=await api("/cameras");SCREENS.cams();}
async function toggleTask(cid,key){
  const c=CAMS.find(x=>x.id===cid);if(!c)return;
  const t=Object.assign({count:false,plate:false,face:false},c.tasks||{});t[key]=!t[key];
  const r=await api(`/cameras/${encodeURIComponent(cid)}/tasks`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks:t})});
  if(r&&r.ok){c.tasks=r.tasks;SCREENS.cams();}
}
async function delCam(id){await api("/cameras/"+encodeURIComponent(id),{method:"DELETE"});CAMS=await api("/cameras");SCREENS.cams();}
async function addWatch(kind){
  const value=$("#w-val").value.trim();if(!value)return;
  const camera=kind==='face'&&$("#w-cam")?$("#w-cam").value:"";
  const r=await api("/lists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,value,label:$("#w-lab").value,list_type:$("#w-type").value,camera})});
  if(kind==='face'&&camera&&r&&!r.enrolled)alert("Bu karede yüz bulunamadı — kişi eklendi ama eşleştirme için yüz embedding'i yok.");
  SCREENS.lists();
}
async function delWatch(kind,id){await api(`/lists/${kind}/${id}`,{method:"DELETE"});SCREENS.lists();}

boot();
</script>
</body>
</html>
