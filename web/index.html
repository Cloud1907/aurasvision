<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AurasVision</title>
<script>try{var t=localStorage.getItem('vai-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --hover:#f3f4f7;
    --ink:#0f172a; --ink-2:#516074; --ink-3:#9aa4b2;
    --line:#e9ebf0; --line-2:#dde0e7;
    --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#ececfb; --accent-ink:#ffffff;
    --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fbf0d9; --danger:#dc2626; --danger-soft:#fdecec;
    --rail:#0b1120; --rail-2:#0f1729; --rail-ink:#c7d0de; --rail-ink-2:#6b7689; --rail-active:#1d2740;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06);
    --shadow-lg:0 10px 30px rgba(15,23,42,.10);
    --r:12px; --r-lg:16px; --t:.16s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme=dark]{
    --bg:#0a0e16; --panel:#121826; --panel-2:#0e131f; --hover:#1a2233;
    --ink:#e9eef7; --ink-2:#9aa6b8; --ink-3:#5d6878;
    --line:#1d2533; --line-2:#2a3445;
    --accent:#6366f1; --accent-2:#818cf8; --accent-soft:#1c2140; --accent-ink:#ffffff;
    --ok:#4ade80; --ok-soft:#11281b; --warn:#fbbf24; --warn-soft:#2b2310; --danger:#f87171; --danger-soft:#2a1414;
    --rail:#070b13; --rail-2:#0b1019; --rail-ink:#aeb9ca; --rail-ink-2:#566073; --rail-active:#161f33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5;}
  ::selection{background:var(--accent-soft);}
  .app{display:flex;min-height:100vh;}
  /* sidebar */
  .rail{width:230px;flex-shrink:0;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .brand b{font-size:16px;letter-spacing:-.02em;color:#fff;font-weight:600;}
  .brand span{font-size:11px;color:var(--rail-ink-2);display:block;letter-spacing:.04em;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-ink-2);padding:14px 10px 6px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--rail-ink);cursor:pointer;font-size:14px;transition:background var(--t),color var(--t);position:relative;}
  .nav a:hover{background:var(--rail-2);color:#fff;}
  .nav a.on{background:var(--rail-active);color:#fff;}
  .nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2);}
  .nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.9;}
  .rail-foot{border-top:1px solid var(--rail-2);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--rail-ink-2);}
  .dot i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--rail-2);background:transparent;color:var(--rail-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);}
  .icon-btn:hover{background:var(--rail-2);color:#fff;}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
  .topbar h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;}
  .topbar .sub{color:var(--ink-2);font-size:13px;margin:2px 0 0;}
  .content{padding:24px 30px;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);}
  .card.pad{padding:18px;}
  .grid{display:grid;gap:16px;}
  /* camera tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:var(--panel-2);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t);}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease;}
  .tile img.loaded{opacity:1;}
  .tile .skel{position:absolute;inset:0;background:linear-gradient(100deg,var(--panel-2) 30%,var(--hover) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .tile .grad{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none;}
  .tile .nm{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:500;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .live{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(7,11,19,.7);color:#fff;font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;letter-spacing:.03em;}
  .live i{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  /* rows / list */
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);transition:background var(--t);}
  .row:last-child{border-bottom:0;}
  .row:hover{background:var(--panel-2);}
  .av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}
  .mut{color:var(--ink-2);}.mut-s{color:var(--ink-3);font-size:12.5px;}
  /* buttons */
  .btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all var(--t);}
  .btn:hover{background:var(--hover);border-color:var(--ink-3);}
  .btn:active{transform:scale(.97);}
  .btn svg{width:16px;height:16px;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn.ico{padding:8px;}
  /* inputs */
  input,select{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;transition:border var(--t),box-shadow var(--t);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input::placeholder{color:var(--ink-3);}
  /* chips */
  .chip{font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  /* metric */
  .metric{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;}
  .metric .k{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;}
  .metric .v{font-size:25px;font-weight:600;letter-spacing:-.02em;}
  /* table */
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-3);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  tr:last-child td{border-bottom:0;}
  .tools{display:flex;flex-direction:column;gap:12px;width:210px;flex-shrink:0;}
  canvas{border-radius:var(--r-lg);border:1px solid var(--line-2);cursor:crosshair;max-width:100%;background:#0b1120;box-shadow:var(--shadow);}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--ink-2);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all var(--t);}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);}
  .empty{padding:40px;text-align:center;color:var(--ink-3);}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="logo" id="logo"></span><div><b>AurasVision</b><span>Görüntü analitiği</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <span class="dot"><i></i> sistem aktif</span>
      <button class="icon-btn" id="theme" onclick="toggleTheme()" aria-label="tema"></button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><div><h1 id="ttl">—</h1><p class="sub" id="tsub"></p></div><div id="tact"></div></div>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
/* ---- ikonlar (inline svg, bağımsız) ---- */
const IC={
  live:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  cams:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  zones:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  test:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  events:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.5 21a1.5 1.5 0 0 0 3 0"/>',
  lists:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/>',
};
const svg=(n,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
document.getElementById('logo').innerHTML=svg('bolt',18);

const NAV=[["live","Canlı","live"],["cams","Kameralar","cams"],["zones","Bölgeler","zones"],["test","Test","test"],["events","Olaylar","events"],["lists","Listeler","lists"]];
const TITLES={live:["Canlı görünüm","Tüm kameralar gerçek zamanlı"],cams:["Kameralar","IP / RTSP kaynakları"],zones:["Bölgeler ve çizgiler","Görüntüye çiz · sürükle düzelt · ✕ sil"],test:["Test ve çalıştır","Analizi çalıştır, sonucu ve videoyu gör"],events:["Olaylar","Birleşik akış — sayım · plaka · yüz"],lists:["İzleme listeleri","Kara liste / VIP — eşleşince uyarı"]};
let CAMS=[],active="live";
const $=s=>document.querySelector(s);
const api=(p,o)=>fetch("/api"+p,o).then(r=>r.json());

function toggleTheme(){const d=document.documentElement;const nx=(d.getAttribute('data-theme')==='dark')?'light':'dark';d.setAttribute('data-theme',nx);try{localStorage.setItem('vai-theme',nx);}catch(e){}themeBtn();}
function themeBtn(){const dark=document.documentElement.getAttribute('data-theme')==='dark';$("#theme").innerHTML=svg(dark?'sun':'moon',17);}

async function boot(){themeBtn();CAMS=await api("/cameras");render();}
function render(){
  $("#nav").innerHTML=`<div class="lbl">İzleme</div>`+NAV.slice(0,4).map(navHtml).join("")+`<div class="lbl">Kayıt</div>`+NAV.slice(4).map(navHtml).join("");
  clearInterval(window._liveTimer);
  const t=TITLES[active];$("#ttl").textContent=t[0];$("#tsub").textContent=t[1];$("#tact").innerHTML="";
  const c=$("#content");c.style.animation="none";void c.offsetWidth;c.style.animation="";
  SCREENS[active]();
}
const navHtml=n=>`<a class="${n[0]===active?'on':''}" onclick="go('${n[0]}')">${svg(n[2])}<span>${n[1]}</span></a>`;
function go(id){active=id;render();}

const SCREENS={
  live(){
    $("#content").innerHTML=`<div class="tiles">${CAMS.map(c=>`
      <div class="tile">
        <div class="skel"></div>
        <img loading="lazy" src="/api/snapshot?camera=${c.id}" alt="${c.name}"
             onload="this.classList.add('loaded');this.previousElementSibling.remove()"/>
        <div class="grad"></div>
        <span class="live"><i></i> CANLI</span>
        <span class="nm">${c.name}</span>
      </div>`).join("")}</div>`;
    clearInterval(window._liveTimer);
    window._liveTimer=setInterval(()=>{document.querySelectorAll('.tile img').forEach(im=>{im.src=im.src.split('&t=')[0]+'&t='+Date.now();});},5000);
  },
  cams(){
    $("#content").innerHTML=`<div class="card">${CAMS.map(c=>`<div class="row">
      <span class="av" style="background:var(--accent-soft);color:var(--accent);">${svg('cams',18)}</span>
      <div style="flex:1;min-width:0;"><div style="font-weight:500;">${c.name}</div><div class="mono mut-s">${c.source}</div></div>
      <span class="chip" style="background:var(--ok-soft);color:var(--ok);"><i style="width:6px;height:6px;border-radius:50%;background:currentColor;"></i> online</span>
      <button class="btn sm ico" title="sil" onclick="delCam('${c.id}')">${svg('x',14)}</button>
      </div>`).join("")}</div>
      <div class="card pad" style="margin-top:16px;">
        <div class="mut-s" style="margin-bottom:10px;">Yeni kamera — RTSP/IP veya yerel video dosyası</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input id="cam-name" placeholder="Ad (ör. Arka Kapı)" style="width:200px;"/>
          <input id="cam-src" placeholder="rtsp://kullanıcı:şifre@ip:554/stream  ·  data/videos/x.mp4" style="flex:1;min-width:240px;"/>
          <button class="btn pri" onclick="addCam()">${svg('plus',15)} Ekle</button></div></div>`;
  },
  async zones(){
    const camId=window._zc||CAMS[0]?.id;window._zc=camId;
    $("#content").innerHTML=`
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
        <select id="zcam" onchange="window._zc=this.value;SCREENS.zones()">${CAMS.map(c=>`<option value="${c.id}" ${c.id===camId?'selected':''}>${c.name}</option>`).join("")}</select>
        <span class="mut-s">Çizgi: görüntüde bas-çek (A→B) · Bölge/İhlal: nokta tıkla, “Bitir”</span></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
        <canvas id="cv" width="640" height="360" style="flex:1 1 440px;touch-action:none;"></canvas>
        <div class="tools">
          <div class="card pad">
            <div class="mut-s" style="margin-bottom:9px;">Araç</div>
            <button class="btn on" id="t-line" onclick="setTool('line')" style="width:100%;margin-bottom:7px;justify-content:flex-start;">— Çizgi (sayma)</button>
            <button class="btn" id="t-zone" onclick="setTool('zone')" style="width:100%;margin-bottom:7px;justify-content:flex-start;">▱ Bölge (alan)</button>
            <button class="btn" id="t-intrusion" onclick="setTool('intrusion')" style="width:100%;justify-content:flex-start;">⚠ İhlal alanı</button>
          </div>
          <div class="card pad">
            <div class="mut-s" style="margin-bottom:9px;">Nesne</div>
            <label style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><input type="checkbox" id="c-person" checked style="width:auto;"> İnsan</label>
            <label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="c-car" style="width:auto;"> Araç</label>
          </div>
          <button class="btn" onclick="finishPoly()">Bölgeyi bitir</button>
          <button class="btn pri" onclick="saveZones()">Kaydet</button>
          <div class="mut-s" id="zstatus"></div>
        </div></div>
      <div class="card pad" style="margin-top:16px;"><div class="mut-s" style="margin-bottom:10px;">Tanımlı çizgi / bölgeler — isim ver, ✕ ile sil</div><div id="zlist"></div></div>`;
    await initEditor(camId);
  },
  test(){
    const camId=window._tc||CAMS[0]?.id;window._tc=camId;
    const kind=window._tk||"count";window._tk=kind;
    const kinds=[["count","Sayım"],["plate","Plaka"],["face","Yüz"],["analyze","Hepsi"]];
    $("#content").innerHTML=`
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;">
        <select id="tcam" onchange="window._tc=this.value">${CAMS.map(c=>`<option value="${c.id}" ${c.id===camId?'selected':''}>${c.name}</option>`).join("")}</select>
        <div class="seg">${kinds.map(k=>`<button class="${k[0]===kind?'on':''}" onclick="window._tk='${k[0]}';SCREENS.test()">${k[1]}</button>`).join("")}</div>
        <button class="btn pri" onclick="runTest()">${svg('play',15)} Çalıştır</button>
        <span class="mut-s" id="trun"></span></div>
      <div id="tres"></div>`;
  },
  async events(){
    const [ev,al]=await Promise.all([api("/events?limit=40"),api("/alerts?limit=15")]);
    const meta={count:["live","var(--accent-soft)","var(--accent)","Çizgi geçişi"],plate:["cams","var(--warn-soft)","var(--warn)","Plaka okuma"],face:["events","var(--ok-soft)","var(--ok)","Yüz"]};
    const alerts=al.length?`<div class="card" style="border-color:var(--danger);margin-bottom:16px;">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);color:var(--danger);font-weight:500;display:flex;align-items:center;gap:8px;">⚠ Uyarılar — izleme listesi eşleşmesi <span class="chip" style="background:var(--danger-soft);color:var(--danger);">${al.length}</span></div>
      ${al.map(a=>`<div class="row">
        <span class="av" style="background:var(--danger-soft);color:var(--danger);">!</span>
        <div style="flex:1;"><div style="font-weight:500;">${a.kind==='plate'?'Plaka':'Yüz'} eşleşmesi · <span class="mono">${a.ref}</span></div><div class="mut-s">${a.label||''} ${a.camera?'· '+a.camera:''}</div></div>
        <span class="chip" style="background:var(--danger-soft);color:var(--danger);">${a.list_type}</span></div>`).join("")}</div>`:"";
    $("#content").innerHTML=alerts+`<div class="card">${ev.length?ev.map(e=>{const m=meta[e.type]||["live","var(--hover)","var(--ink-2)",e.type];return `<div class="row">
      <span class="av" style="background:${m[1]};color:${m[2]};">${svg(m[0],17)}</span>
      <div style="flex:1;"><div style="font-weight:500;">${m[3]}</div><div class="mono mut-s">${e.detail}</div></div>
      <span class="mut-s">${(+e.ts_seconds).toFixed(1)} sn · kare ${e.frame_idx}</span></div>`}).join("")
      :`<div class="empty">Henüz olay yok. Test ekranından bir analiz çalıştır.</div>`}</div>`;
  },
  async lists(){
    const kind=window._lk||"plate";window._lk=kind;
    const rows=await api("/lists?kind="+kind);
    const lt=t=>({blacklist:["kara liste","var(--danger-soft)","var(--danger)"],vip:["VIP","var(--accent-soft)","var(--accent)"],visitor:["ziyaretçi","var(--warn-soft)","var(--warn)"],allowed:["izinli","var(--ok-soft)","var(--ok)"]}[t]||["","var(--hover)","var(--ink-2)"]);
    const body=rows.length?rows.map(r=>{const p=lt(r.list_type);return `<tr>
      <td class="${kind==='plate'?'mono':''}" style="font-weight:500;">${kind==='plate'?r.plate:r.name}</td>
      <td class="mut-s">${r.label||'—'}</td>
      <td><span class="chip" style="background:${p[1]};color:${p[2]};">${p[0]}</span></td>
      <td style="text-align:right;"><button class="btn sm ico" onclick="delWatch('${kind}',${r.id})">${svg('x',14)}</button></td></tr>`}).join("")
      :`<tr><td colspan="4" class="empty">Liste boş.</td></tr>`;
    $("#content").innerHTML=`
      <div class="seg" style="margin-bottom:16px;">
        <button class="${kind==='plate'?'on':''}" onclick="window._lk='plate';SCREENS.lists()">Plaka</button>
        <button class="${kind==='face'?'on':''}" onclick="window._lk='face';SCREENS.lists()">Personel / yüz</button></div>
      <div class="card"><table><thead><tr><th>${kind==='plate'?'Plaka':'Ad'}</th><th>Etiket</th><th>Liste</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;">
        <input id="w-val" placeholder="${kind==='plate'?'34 ABC 123':'Ahmet Yılmaz'}" style="flex:1;min-width:160px;"/>
        <input id="w-lab" placeholder="etiket" style="width:120px;"/>
        <select id="w-type"><option value="blacklist">kara liste</option><option value="vip">VIP</option><option value="visitor">ziyaretçi</option><option value="allowed">izinli</option></select>
        ${kind==='face'?`<select id="w-cam" title="bu kameranın karesinden yüz alınır"><option value="">yüz alma yok</option>${CAMS.map(c=>`<option value="${c.id}">📷 ${c.name}</option>`).join("")}</select>`:''}
        <button class="btn pri" onclick="addWatch('${kind}')">${svg('plus',15)} Ekle</button></div>
      ${kind==='face'?'<div class="mut-s" style="margin-top:8px;">Yüz tanıma için bir kamera seç → o karedeki en büyük yüz embedding olarak kaydedilir (KVKK: ham görüntü saklanmaz, sadece vektör).</div>':''}`;
  },
};

/* ---- bölge editörü ---- */
let TOOL="line", ZONES=[], DRAFT=[], IMG=null, CV=null, CX=null, DRAG=null, DRAWING=null;
const COL={line:"#f59e0b",zone:"#8b5cf6",intrusion:"#ef4444"};
function setTool(t){TOOL=t;["line","zone","intrusion"].forEach(x=>document.getElementById("t-"+x)?.classList.toggle("on",x===t));DRAFT=[];DRAWING=null;draw();}
function curClasses(){const c=[];if($("#c-person")?.checked)c.push("person");if($("#c-car")?.checked)c.push("car");return c;}
function defName(kind){const n=ZONES.filter(z=>z.kind===kind).length+1;return (kind==="line"?"Çizgi ":kind==="zone"?"Bölge ":"İhlal ")+n;}
async function initEditor(camId){
  CV=$("#cv");CX=CV.getContext("2d");DRAFT=[];DRAWING=null;DRAG=null;
  const z=await api("/zones?camera="+camId);
  ZONES=z.map(x=>({kind:x.kind,name:x.name||defName(x.kind),points:JSON.parse(x.points||"[]"),classes:JSON.parse(x.classes||"[]"),direction:x.direction}));
  IMG=new Image();
  IMG.onload=()=>{draw();renderZoneList();};
  IMG.onerror=()=>{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);CX.fillStyle="#64748b";CX.fillText("snapshot alınamadı",240,180);};
  IMG.src="/api/snapshot?camera="+camId+"&t="+Date.now();
  CV.onmousedown=onDown;CV.onmousemove=onMove;window.onmouseup=onUp;
  renderZoneList();
}
function evNorm(e){const r=CV.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];}
function px(p){return [p[0]*CV.width,p[1]*CV.height];}
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hitHandle(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){const z=ZONES[zi];for(let pi=0;pi<z.points.length;pi++){const[hx,hy]=px(z.points[pi]);if(dist(x*CV.width,y*CV.height,hx,hy)<11)return{zi,pi};}}return null;}
function xBadge(z){const p=px(z.points[z.points.length-1]);return[p[0]+15,p[1]-15];}
function hitX(x,y){for(let zi=ZONES.length-1;zi>=0;zi--){if(!ZONES[zi].points.length)continue;const[bx,by]=xBadge(ZONES[zi]);if(dist(x*CV.width,y*CV.height,bx,by)<11)return zi;}return null;}
function onDown(e){
  const[x,y]=evNorm(e);
  const xi=hitX(x,y);if(xi!=null){ZONES.splice(xi,1);draw();renderZoneList();return;}
  const h=hitHandle(x,y);if(h){DRAG=h;return;}
  if(TOOL==="line"){DRAWING={a:[x,y],b:[x,y]};}
  else{DRAFT.push([x,y]);draw();}
}
function onMove(e){
  if(!DRAG&&!DRAWING)return;
  const[x,y]=evNorm(e);
  if(DRAG){ZONES[DRAG.zi].points[DRAG.pi]=[x,y];draw();}
  else if(DRAWING){DRAWING.b=[x,y];draw();}
}
function onUp(){
  if(DRAWING){const d=dist(DRAWING.a[0],DRAWING.a[1],DRAWING.b[0],DRAWING.b[1]);
    if(d>0.03){ZONES.push({kind:"line",name:defName("line"),points:[DRAWING.a,DRAWING.b],classes:curClasses(),direction:"AtoB"});renderZoneList();}
    DRAWING=null;draw();}
  if(DRAG){DRAG=null;renderZoneList();}
}
function finishPoly(){if((TOOL==="zone"||TOOL==="intrusion")&&DRAFT.length>=3){ZONES.push({kind:TOOL,name:defName(TOOL),points:DRAFT.slice(),classes:curClasses(),direction:""});DRAFT=[];draw();renderZoneList();}}
function delZone(i){ZONES.splice(i,1);draw();renderZoneList();}
function renameZone(i,v){ZONES[i].name=v;}
function renderZoneList(){
  const el=$("#zlist");if(!el)return;
  if(!ZONES.length){el.innerHTML='<span class="mut-s">Henüz çizim yok. Çizgi için görüntüde bas-çek yap.</span>';return;}
  el.innerHTML=ZONES.map((z,i)=>`<div class="row" style="padding-left:0;padding-right:0;">
    <span class="av" style="background:${z.kind==='line'?'var(--warn-soft)':z.kind==='zone'?'var(--accent-soft)':'var(--danger-soft)'};color:${COL[z.kind]};">${z.kind==='line'?'—':z.kind==='intrusion'?'⚠':'▱'}</span>
    <input value="${z.name}" oninput="renameZone(${i},this.value)" style="flex:1;"/>
    <span class="mut-s">${z.kind==='line'?'A→B sayım':z.kind==='intrusion'?'ihlal alanı':'alan'}</span>
    <button class="btn sm ico" title="sil" onclick="delZone(${i})">${svg('x',14)}</button></div>`).join("");
}
function sideLabel(t,p,c){CX.beginPath();CX.arc(p[0],p[1],11,0,7);CX.fillStyle=c;CX.fill();CX.fillStyle="#fff";CX.font="bold 13px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText(t,p[0],p[1]);CX.textAlign="start";CX.textBaseline="alphabetic";}
function draw(){
  if(!CX)return;
  if(IMG&&IMG.complete&&IMG.naturalWidth)CX.drawImage(IMG,0,0,CV.width,CV.height);else{CX.fillStyle="#0b1120";CX.fillRect(0,0,CV.width,CV.height);}
  ZONES.forEach(z=>{
    const c=COL[z.kind]||"#fff";const pts=z.points.map(px);
    CX.strokeStyle=c;CX.lineWidth=3;CX.fillStyle=c+"33";
    CX.beginPath();pts.forEach((p,i)=>i?CX.lineTo(p[0],p[1]):CX.moveTo(p[0],p[1]));
    if(z.kind!=="line"){CX.closePath();CX.fill();}CX.stroke();
    pts.forEach(p=>{CX.beginPath();CX.arc(p[0],p[1],6,0,7);CX.fillStyle="#fff";CX.fill();CX.lineWidth=2;CX.strokeStyle=c;CX.stroke();});
    if(z.kind==="line"&&pts.length===2){
      const mx=(pts[0][0]+pts[1][0])/2,my=(pts[0][1]+pts[1][1])/2;
      let dx=pts[1][0]-pts[0][0],dy=pts[1][1]-pts[0][1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const nx=-dy,ny=dx,OFF=26;
      const A=[mx-nx*OFF,my-ny*OFF],B=[mx+nx*OFF,my+ny*OFF];
      CX.strokeStyle=c;CX.lineWidth=2;CX.beginPath();CX.moveTo(A[0],A[1]);CX.lineTo(B[0],B[1]);CX.stroke();
      const ah=Math.atan2(B[1]-A[1],B[0]-A[0]);
      CX.save();CX.translate(B[0],B[1]);CX.rotate(ah);CX.fillStyle=c;CX.beginPath();CX.moveTo(0,0);CX.lineTo(-8,-4);CX.lineTo(-8,4);CX.closePath();CX.fill();CX.restore();
      sideLabel("A",A,c);sideLabel("B",B,c);
      CX.fillStyle=c;CX.font="bold 12px sans-serif";CX.fillText(z.name||"",pts[0][0]+8,pts[0][1]-8);
    }
    const[bx,by]=xBadge(z);CX.beginPath();CX.arc(bx,by,9,0,7);CX.fillStyle="#ef4444";CX.fill();
    CX.fillStyle="#fff";CX.font="bold 14px sans-serif";CX.textAlign="center";CX.textBaseline="middle";CX.fillText("×",bx,by);CX.textAlign="start";CX.textBaseline="alphabetic";
  });
  if(DRAWING){const a=px(DRAWING.a),b=px(DRAWING.b);CX.strokeStyle="#fff";CX.setLineDash([6,4]);CX.lineWidth=2;CX.beginPath();CX.moveTo(a[0],a[1]);CX.lineTo(b[0],b[1]);CX.stroke();CX.setLineDash([]);}
  if(DRAFT.length){CX.strokeStyle="#fff";CX.lineWidth=2;DRAFT.map(px).forEach((p,i,a)=>{CX.beginPath();CX.arc(p[0],p[1],4,0,7);CX.fillStyle="#fff";CX.fill();if(i){CX.beginPath();CX.moveTo(a[i-1][0],a[i-1][1]);CX.lineTo(p[0],p[1]);CX.stroke();}});}
}
async function saveZones(){
  const r=await api("/zones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:window._zc,zones:ZONES})});
  $("#zstatus").textContent=r.ok?`✓ ${r.count} kayıt kaydedildi`:"hata";
}

async function runTest(){
  const camera=window._tc,kind=window._tk;
  $("#trun").textContent="başlıyor…";
  $("#tres").innerHTML=`<div class="card pad"><div class="skel" style="height:60px;border-radius:10px;"></div></div>`;
  try{
    const {job_id}=await api("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera,kind})});
    let st;
    for(let i=0;i<900;i++){
      st=await api("/run/"+job_id);
      if(st.status==="done"||st.status==="error")break;
      $("#trun").innerHTML=`<span style="color:var(--accent);">⏳ ${st.stage||"çalışıyor"}…</span>`;
      if(st.live&&st.live.length)renderLive(st.live);
      await new Promise(r=>setTimeout(r,500));
    }
    if(!st||st.status==="error"){$("#trun").textContent="hata: "+(st?st.error:"zaman aşımı");$("#tres").innerHTML="";return;}
    $("#trun").textContent="✓ bitti";
    renderResult(st.summary,st.videos);
  }catch(e){$("#trun").textContent="hata: "+e;$("#tres").innerHTML="";}
}
function renderLive(live){
  const rows=live.slice(-40).map((r,i)=>`<div class="row" style="animation:fade .2s ease;">
    <span class="av" style="background:var(--warn-soft);color:var(--warn);">${svg('cams',16)}</span>
    <div style="flex:1;"><span class="mono" style="font-weight:500;">${r.plate}</span></div>
    <span class="mut-s">kare ${r.frame} · ${r.ts} sn${r.conf!=null?' · %'+Math.round(r.conf*100):''}</span></div>`).join("");
  $("#tres").innerHTML=`<div class="card"><div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:500;">${svg('cams',17)} Canlı plaka akışı <span class="chip" style="background:var(--accent-soft);color:var(--accent);">${live.length}</span></div><div id="liverows" style="max-height:340px;overflow:auto;">${rows}</div></div>`;
  const lr=$("#liverows");if(lr)lr.scrollTop=lr.scrollHeight;
}
function renderResult(s,videos){
  const m=[];
  if(s.count){const ls=s.count.lines||[];
    const perline=ls.length?`<div class="mut-s" style="margin-top:8px;line-height:1.9;">${ls.map(l=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px;"></span>${l.name}: <b>${l.in}</b> giriş / <b>${l.out}</b> çıkış`).join("<br>")}</div>`:'';
    m.push(`<div class="metric"><div class="k">Sayım · A→B giriş / B→A çıkış${ls.length>1?' · '+ls.length+' çizgi':''}</div><div class="v">${s.count.in} <span class="mut" style="font-size:15px;">giriş</span> · ${s.count.out} <span class="mut" style="font-size:15px;">çıkış</span></div><div class="mut-s">${s.count.frames} kare</div>${perline}</div>`);}
  if(s.plate){const al=s.plate.alerts||[],vt=s.plate.voted||[];
    const list=vt.length?vt.slice(0,10).map(v=>`${v.plate}<span class="mut-s"> ×${v.count}</span>`).join(" · "):(s.plate.plates||[]).slice(0,10).join(" · ");
    m.push(`<div class="metric" ${al.length?'style="border:1px solid var(--danger);"':''}><div class="k">Plaka · ${s.plate.total} okuma → ${vt.length} araç (oylama)</div><div class="mono" style="margin-top:4px;font-size:13px;line-height:1.9;">${list||'—'}</div>${al.length?`<div class="chip" style="background:var(--danger-soft);color:var(--danger);margin-top:8px;">⚠ ${al.length} kara liste: ${al.map(a=>a.plate).join(", ")}</div>`:''}</div>`);}
  if(s.face){const al=s.face.alerts||[];m.push(`<div class="metric" ${al.length?'style="border:1px solid var(--danger);"':''}><div class="k">Yüz (anonim)</div><div class="v">${s.face.detections}</div><div class="mut-s">E:${s.face.male} · K:${s.face.female} · ort. yaş ${s.face.avg_age}</div>${al.length?`<div class="chip" style="background:var(--danger-soft);color:var(--danger);margin-top:8px;">⚠ ${al.length} liste eşleşmesi: ${al.map(a=>a.name).join(", ")}</div>`:''}</div>`);}
  const cb="?t="+Date.now();  // cache-buster: aynı dosya adı → tarayıcı eskiyi göstermesin
  const vids=(videos||[]).map(v=>`<video src="${v}${cb}" controls style="width:100%;border-radius:var(--r-lg);border:1px solid var(--line);margin-top:14px;background:#000;box-shadow:var(--shadow);"></video>`).join("");
  // Okunan plakalar — video altında alt alta liste (ANPR kaydı)
  let plateList="";
  if(s.plate){const vt=s.plate.voted||[];const bl=new Set((s.plate.alerts||[]).map(a=>a.plate));
    plateList=`<div class="card" style="margin-top:14px;"><div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px;">${svg('cams',17)} Okunan plakalar <span class="chip" style="background:var(--accent-soft);color:var(--accent);">${vt.length}</span></div>`+
      (vt.length?vt.map(v=>{const black=bl.has(v.plate);return `<div class="row">
        <span class="av" style="background:${black?'var(--danger-soft)':'var(--warn-soft)'};color:${black?'var(--danger)':'var(--warn)'};">${black?'!':svg('cams',16)}</span>
        <div style="flex:1;"><span class="mono" style="font-size:15px;font-weight:500;">${v.plate}</span> <span class="mut-s">×${v.count}</span></div>
        ${black?'<span class="chip" style="background:var(--danger-soft);color:var(--danger);">kara liste</span>':''}
        <span class="mut-s">${v.conf!=null?'%'+Math.round(v.conf*100):''}</span></div>`}).join(""):'<div class="empty">Plaka okunmadı.</div>')+`</div>`;}
  $("#tres").innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">${m.join("")}</div>${vids}${plateList}`;
}
async function addCam(){const name=$("#cam-name").value.trim(),source=$("#cam-src").value.trim();if(!name||!source)return;await api("/cameras",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,source})});CAMS=await api("/cameras");SCREENS.cams();}
async function delCam(id){await fetch("/api/cameras/"+id,{method:"DELETE"});CAMS=await api("/cameras");SCREENS.cams();}
async function addWatch(kind){
  const value=$("#w-val").value.trim();if(!value)return;
  const camera=kind==='face'&&$("#w-cam")?$("#w-cam").value:"";
  const r=await api("/lists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,value,label:$("#w-lab").value,list_type:$("#w-type").value,camera})});
  if(kind==='face'&&camera&&r&&!r.enrolled)alert("Bu karede yüz bulunamadı — kişi eklendi ama eşleştirme için yüz embedding'i yok.");
  SCREENS.lists();
}
async function delWatch(kind,id){await fetch(`/api/lists/${kind}/${id}`,{method:"DELETE"});SCREENS.lists();}

boot();
</script>
